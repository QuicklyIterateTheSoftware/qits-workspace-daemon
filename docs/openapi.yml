openapi: 3.1.0

info:
  title: qits-workspace-daemon HTTP API
  version: "1"
  description: |
    Everything qits serves from **inside** a workspace container: the agent worktrees the workspace
    hosts and each one's files, the commands surface, the coding-agent surface, and two websockets.

    ## A workspace hosts agents (qits-1152)

    A workspace keeps one base clone of its wrapper (`/workspace/base`) and never works in it. Each
    agent gets an **agent worktree** at `/workspace/agents/{agentId}/{wrapper}`: the wrapper on the
    agent's wrapper branch, each submodule detached at its `origin/main`. `POST /agent-worktrees`
    makes it and starts the agent's harness there; everything about one agent sits below
    `/agent-worktrees/{agentId}`. The checkout-wide routes of the single-checkout model (`/files`,
    `/fast-forward`, `/update-from-parent`, `POST /agents`, `/agents/turn`, `/agents/entity`,
    `/agents/blocked`, `POST /commands`, `/commands/actions`, `/bootstrap-commands`) are gone.

    ## This file is written by hand, and that is deliberate

    There is nothing to generate it from. The server is a raw `io.vertx.core.http.HttpServer` with
    a `switch` dispatcher (`WorkspaceApi`) and hand-built `JsonObject` bodies (`WorkspaceJson`,
    `CommandJson`, `AgentJson`) — no JAX-RS, no Jackson, no `smallrye-openapi`, because every
    dependency here is a decision about the GraalVM native image.

    So this document has one acceptance rule, and it is what makes it worth trusting:

    > **Every field named here is asserted as a literal string by a test in this repository.**

    Those tests are `WorkspaceApiTest`, `CommandsApiTest` and `AgentsApiTest`, which drive a real
    Vert.x server on an ephemeral port against real
    processes and a real git tree. They assert wire keys as literal strings on purpose — a test
    that read the names off the records would rename itself along with the bug. Change a key here
    and you must change a test; change a test and you must change this file.

    ## Addressing: told, never derived

    The paths below are what the daemon *serves*. They are not the whole URL a caller uses.

    qits-workspaces proxies to this API at `/workspaces/container/{workspaceId}/**` and **forwards
    the caller's path untouched** — no hop in the chain rewrites anything. The daemon is therefore
    *told* where it is mounted, as `qits.workspace-daemon.api-base-path`
    (`QITS_WORKSPACE_DAEMON_API_BASE_PATH`, injected as `/workspaces/container/{workspaceId}`).
    With a base configured, `GET /agent-worktrees` is served at
    `GET /workspaces/container/12/agent-worktrees` and only there. With none — every direct caller,
    every test — it is served at `GET /agent-worktrees`.

    No `{repoId}/{workspaceId}` prefix appears in any path: this daemon serves exactly one
    workspace, so those segments would be a constant the caller has to get right. The response
    bodies carry both ids back.

    ## Reachability

    The server binds `127.0.0.1` and **does not bind at all** without
    `qits.workspace-daemon.api-token`. It has no address on the docker network: qits asks for a
    stream over the control socket it already holds open, and the daemon dials *out* and pipes that
    connection to this loopback port. A peer container is refused by the network stack rather than
    by a token check.

    That makes the daemon's control socket load-bearing for this API. **While that socket is down,
    every route here is unreachable** — qits-workspaces answers 502, not a daemon status. Plan the
    client for it.

    ## Authentication

    `Authorization: Bearer <qits.workspace-daemon.api-token>` on every request *and* on both
    websocket handshakes. This is peer authentication — qits is calling — never user
    authentication; the daemon has no idea who the user is. A browser reaches it only through
    qits-workspaces' proxy, which **replaces** the inbound `Authorization` with the daemon token,
    so the browser never holds this credential and cannot smuggle one in.

    A missing or wrong token is `401` with the same body whatever the path, so a caller with no
    credential learns only that one is required — never whether the path it asked for exists.

    ## Conventions that hold everywhere

    - Every response is `application/json` with `X-Content-Type-Options: nosniff`. The bodies embed
      repository-controlled text.
    - Every non-2xx body is `{"message": "…"}` and nothing else.
    - **Absent optionals are omitted, never emitted as an explicit `null`.** Lists are always
      present, `[]` when empty.
    - Timestamps are ISO-8601 strings (`Instant.toString()`).
    - Enums go out as their constant name.
    - `503` means "not wired yet" and is retryable — the daemon is up but the capability's
      preconditions are not met. It is never a `404`, which would read as "this daemon will never
      serve that".

    ## The websockets

    OpenAPI does not model websockets, so the two live under `x-websockets` at the bottom of this
    file, with the same level of detail. Read that section before building a client for either.

servers:
  - url: /
    description: The daemon addressed directly, with no base path configured.
  - url: /workspaces/container/{workspaceId}
    description: |
      Through qits-workspaces' proxy, which is how a browser reaches it. The daemon is configured
      with this base; it matches no shape and strips no leading segment.
    variables:
      workspaceId:
        default: "1"
        description: The workspace row id qits-workspaces keys the container on.

security:
  - bearerAuth: []

tags:
  - name: agent worktrees
    description: The agents this workspace hosts, their harnesses, and what they leave behind.
  - name: files
    description: Reading one agent's worktree.
  - name: commands
    description: Launching and inspecting this container's processes.
  - name: coding agents
    description: The harness surface no one agent owns — sign-in, plugins, sessions, refinement.

paths:
  /commands:
    get:
      tags: [commands]
      operationId: listCommands
      summary: The commands this container has run, newest first.
      description: |
        **This container's**, and nothing else. The store is in-memory and a container recreate
        starts it empty — there is no host-side fallback (`WorkspaceCommandHistory` on the host has
        no implementation anywhere), so a stopped container means no run history at all. Render
        that as an explicit state, not as an empty list.

        Bounded at 200 finished commands, oldest evicted; running commands are never evicted.

        Every agent's harness is a command here, and a command id is unique across agents, so the
        list and the sockets need no agent in their path. Launching a checkout-declared action
        (`POST /commands`, `GET /commands/actions`) went with the Actions tab (qits-1152).
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/CommandStatus" }
          description: |
            Narrows the list. An unparseable value is a `400` rather than a silently wider filter —
            quietly widening would show a caller more than it asked for.
      responses:
        "200":
          description: The list, each row in the `entries[].command` envelope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/CommandsUnavailable" }

  /commands/{commandId}:
    get:
      tags: [commands]
      operationId: getCommand
      summary: One command.
      parameters:
        - $ref: "#/components/parameters/CommandId"
      responses:
        "200":
          description: The command.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "404": { $ref: "#/components/responses/NoSuchCommand" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/CommandsUnavailable" }

  /commands/{commandId}/log:
    get:
      tags: [commands]
      operationId: getCommandLog
      summary: A command's captured log lines, in order.
      description: |
        Capped at 50,000 lines per command: heap here is a container sized for the workspace's own
        build, not a host with a disk. A command that outputs more loses its oldest lines.

        **`severity` is never set on this daemon.** `ControlSocket` wires the log service with a
        null classifier, so nothing stamps one — pattern- and severity-based error detection was
        deleted upstream and is not coming back. The field and its filter remain part of the shape
        the host DTO reconstructs; the filter narrows to nothing.
      parameters:
        - $ref: "#/components/parameters/CommandId"
        - name: severity
          in: query
          required: false
          schema: { $ref: "#/components/schemas/LogSeverity" }
          description: An unparseable value is a `400`, as on `/commands?status=`.
        - name: channel
          in: query
          required: false
          schema: { $ref: "#/components/schemas/LogChannel" }
          description: |
            `TRANSCRIPT` is the imported agent transcript — the lasting record of a chat, as
            distinct from the live socket. An unparseable value is a `400`.
      responses:
        "200":
          description: The lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandLog" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NoSuchCommand" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/CommandsUnavailable" }

  /commands/{commandId}/terminate:
    post:
      tags: [commands]
      operationId: terminateCommand
      summary: Signal a running command's process group.
      description: |
        Signals the whole process group, not the child: a compound script's children are only
        reachable that way. Answers the command in its post-terminate state.

        Distinct from *closing a socket*, which only detaches and leaves the process running.
      parameters:
        - $ref: "#/components/parameters/CommandId"
      responses:
        "200":
          description: The command.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "404": { $ref: "#/components/responses/NoSuchCommand" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/CommandsUnavailable" }

  /agents/sign-in:
    post:
      tags: [coding agents]
      operationId: openSignInTerminal
      summary: Open the harness's sign-in terminal.
      description: |
        A **door**, opened deliberately, and until this existed there was none.

        The login REPL used to be reachable only by accident: an unauthenticated harness made a
        launch quietly answer a login terminal instead of the session that was asked for, and the
        caller redirected the user into it without saying so. That substitution is gone — a start
        against a harness nobody has signed in is a `409` (see `POST /agent-worktrees`) — so this
        is how a signed-out platform becomes a signed-in one. Somebody has to complete the OAuth
        once per credential volume; after that every container on it is signed in.

        It answers the ordinary `{command: …}` envelope, because a sign-in terminal is a command in
        this container like any other: attach to `WS /terminal/commands/{id}` and drive it.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInRequest" }
      responses:
        "200":
          description: The sign-in terminal, as a command.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandEnvelope" }
        "400":
          description: An unparseable `agentType`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

  /agents/available:
    get:
      tags: [coding agents]
      operationId: availableAgents
      summary: The harnesses this daemon can launch, the resolved default, and what each reports.
      description: |
        The default is resolved from the base clone's `.qits-config.yml` (`agent.defaultType`)
        falling through to the daemon's. Fetch once per page; it does not change under a container.

        A **resumed** session keeps its original harness — only a fresh launch may pick one.

        Beside the list, `capabilities` carries what each harness in this image reported it can be
        configured with — its models, its effort levels or the fact that it has none, its version,
        and whether anybody is signed in on the shared credential volume. It is produced by running
        the binaries **once at container start**, never on this request path: the binaries live in
        the image and the editor that needs them is a platform-wide route with no container in
        front of it. qits-projects caches this keyed by harness and `imageVersion`.
      responses:
        "200":
          description: The harnesses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailableAgents" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

  /agent-sessions:
    get:
      tags: [coding agents]
      operationId: agentSessions
      summary: The session lineage, as a tree.
      description: |
        **A nested tree, not a list.** `children[]` recurses to arbitrary depth along
        `forkedFromSessionId` edges; `subagents[]` is a flat list one level deeper, the side-chains
        a session's `Task` calls spawned.

        The index is in-memory and dies with the container. The transcripts themselves do not —
        the harness writes them to a volume shared across workspaces — so what a recreate loses is
        the *index* of them, which is exactly why resume is refused across containers.
      responses:
        "200":
          description: The tree, roots first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSessionTree" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

  /agent-plugins:
    get:
      tags: [coding agents]
      operationId: listPlugins
      summary: The plugins present on the shared credential volume.
      description: |
        Read from the volume's `settings.json` rather than by shelling the CLI. A volume with
        nothing ever installed answers `installed: []`, not an error.
      responses:
        "200":
          description: The installed set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

  /agent-plugins/{pluginId}/install:
    post:
      tags: [coding agents]
      operationId: installPlugin
      summary: Install a plugin from the marketplace.
      description: |
        Shells `claude plugin install <pluginId>@claude-plugins-official` — the only supported way
        to do it. Idempotent: the CLI no-ops an already-installed plugin.

        Answers the **refreshed installed set**, the same envelope the listing uses, so a client
        needs no follow-up read to see the result of what it just did.

        Claude Code only; asking for one under another harness is a `400`.
      parameters:
        - name: pluginId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
          description: |
            **The bare id** — the marketplace suffix the listing reports
            (`<id>@claude-plugins-official`) is appended by the daemon, so the qualified form is
            refused. Pattern-matched before it reaches a shell, because the value crosses from an
            untrusted caller into an argv.
      responses:
        "200":
          description: The installed set, refreshed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginList" }
        "400":
          description: An id that fails the pattern, a non-Claude harness, or a failed install.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: |
            Any verb other than `install` under `/agent-plugins/{id}/`. There is no uninstall.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

  /prompt-refinements:
    post:
      tags: [coding agents]
      operationId: refinePrompt
      summary: Rewrite a rough transcript into a prompt.
      description: |
        One model call over the harness already installed in this container. The surviving half of
        the old speech flow — the recorder, the level meter and the audio round trip are gone; this
        is one button on a textarea.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefinementRequest" }
      responses:
        "200":
          description: The rewritten prompt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refinement" }
        "400":
          description: A blank or missing `transcript`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

  /agent-worktrees:
    get:
      tags: [agent worktrees]
      operationId: listAgentWorktrees
      summary: Every agent with a worktree in this workspace.
      description: |
        **A JSON array**, the one top-level array on this API. It lists every agent whose worktree
        is on the workspace volume, whether or not this process has started it since it came up:
        after a container restart an agent is listed with `harnessRunning: false`, and its
        `workId`, `wrapperBranch` and `sessionId` come from the `agent.json` the daemon keeps
        beside the worktree (no credential is ever written there).

        Each repository's state is read from git on every call, so this is not a cheap poll.
      responses:
        "200":
          description: The agents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentWorktree" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }
    post:
      tags: [agent worktrees]
      operationId: startAgentWorktree
      summary: Make an agent's worktree if missing, and start its harness there.
      description: |
        **Idempotent.** The worktrees are made where they are missing and never touched where they
        exist, because they may hold work. A harness that already runs is left running and
        answered (`launched: false`); one that does not is started.

        The wrapper worktree is on `wrapperBranch`: continued from `origin/<wrapperBranch>` when the
        git host has it, else new from the wrapper's `origin/main`. Each submodule is a worktree
        **detached** at its own `origin/main`; in each one the agent changes, the agent creates
        its own branch `<wrapperBranch>-<name>` (a `pre-commit` hook refuses commits on `main` or
        on a detached HEAD and says so).

        **Resume.** With a `sessionId` whose files the harness still has (they live on the shared
        harness volume, keyed by the worktree's path, so they outlive a container restart), the
        harness resumes that session (`resumed: true`). Without them it starts a new one; the
        answer's `sessionId` is then the new id.

        **The credential.** `env` is laid over the harness process's environment and reaches
        nothing else: never a file, never git config. The daemon keeps it in memory to push the
        agent's branches as the agent. After a restart it is not known until this is called again,
        and until then the agent's branches wait rather than being pushed as the workspace.

        `instruction` is the opening turn, on a fresh or a resumed session alike.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentWorktreeStart" }
      responses:
        "200":
          description: The agent's worktree and its harness.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentWorktreeStarted" }
        "400":
          description: |
            A missing `agentId`, `workId` or `wrapperBranch`; an `agentId` that is not a safe
            directory name; a `wrapperBranch` that is not a valid branch, starts with `-`, or is the
            default branch; an unknown `harness`, `mode` or `surface`; an `env` that is not an
            object of strings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            Either git would not make the wrapper worktree — its branch is checked out in another
            agent's worktree, say — and the `message` says why, or nobody has signed the harness in,
            which answers the `NotSignedIn` body. Match `error`, never the sentence.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Error" }
                  - { $ref: "#/components/schemas/NotSignedIn" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

  /agent-worktrees/{agentId}:
    get:
      tags: [agent worktrees]
      operationId: getAgentWorktree
      summary: One agent, as the list reports it.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentWorktree" }
        "404": { $ref: "#/components/responses/NoSuchAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }
    delete:
      tags: [agent worktrees]
      operationId: removeAgentWorktree
      summary: Stop the agent and remove its worktrees and local branches.
      description: |
        **Refused while work would be lost**: uncommitted changes, or commits no remote branch has
        (a commit on a detached HEAD included). The `409` carries the cleanup check, so the caller
        can hand the leftovers back to the agent. `force=true` removes it anyway — for a person's
        explicit discard, never for the cleanup sweep.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Remove even when the cleanup check finds work.
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRemoved" }
        "409":
          description: Not removed; this is what would have been lost.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupCheck" }
        "404": { $ref: "#/components/responses/NoSuchAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

  /agent-worktrees/{agentId}/yield:
    post:
      tags: [agent worktrees]
      operationId: yieldAgent
      summary: Stop the agent's harness and keep everything else.
      description: |
        A blocked agent yields the workspace's harness slot: its process stops (memory freed), and
        its worktree, branches and session stay. A turn or a start resumes it with its session.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Whether a running harness was stopped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentYielded" }
        "404": { $ref: "#/components/responses/NoSuchAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

  /agent-worktrees/{agentId}/turn:
    post:
      tags: [agent worktrees]
      operationId: deliverAgentTurn
      summary: Say something to the agent, starting its harness again if it stopped.
      description: |
        The host-side twin of typing into the command websocket, for one agent. Delivered verbatim:

        | `command.kind` | how the text is delivered |
        |---|---|
        | `CHAT` | a user turn on the harness's stdin, as the chat socket sends |
        | `TERMINAL` | keystrokes into the PTY, followed by a carriage return |

        **A stopped harness is started again first**, resuming its session when the session's
        files are there, with the text as its opening turn (`restarted: true`). So `delivered` is
        true whenever the agent is known here.

        **The keystroke caveat is kept.** A TUI that is still starting has no prompt to type into
        yet, and this route does not buffer for it. `delivered` means the bytes were accepted for a
        live session, never that a prompt consumed them.

        An agent this process has not started since it came up is a `404`: after a restart the
        credential is not known, so the host starts the agent again with `POST /agent-worktrees`.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentTurnRequest" }
      responses:
        "200":
          description: Where the turn went.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTurnResult" }
        "400":
          description: A missing or blank `text`, or an unparseable body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NoSuchAgent" }
        "409":
          description: The harness had to be started again and nobody has signed it in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotSignedIn" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

  /agent-worktrees/{agentId}/entity:
    post:
      tags: [agent worktrees]
      operationId: setAgentEntity
      summary: Tell an agent its entity's title, status and blocked flag; rename its session.
      description: |
        A session name is `[❗|⁉️]<status square> <id> <title>`; the id is the agent's entity id
        and this call moves the other facts, whole — a `title` or `status` that is null or absent
        is cleared, not kept. The facts are stored first, so every launch of this agent renders the
        new name. The agent's live Claude Remote Control chat is renamed over its own stdin at once;
        a live interactive session is renamed at its next idle moment. Other agents are untouched.
        See `AgentLaunchService.setEntity`.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentEntityRequest" }
      responses:
        "200":
          description: The facts this call left standing, and how many live sessions carry the name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEntityResult" }
        "400":
          description: |
            A missing or non-boolean `blocked`, a `title`, `status` or `blockSource` that is neither
            a string nor null, or an unparseable body. Nothing is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NoSuchAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

  /agent-worktrees/{agentId}/blocked:
    post:
      tags: [agent worktrees]
      operationId: setAgentBlocked
      summary: Mark an agent's entity BLOCKED or not, keeping its title and status.
      description: |
        The flag alone; `POST …/entity` moves all the facts. Renames the agent's live sessions as
        that route does.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentBlockedRequest" }
      responses:
        "200":
          description: The marker this call left standing, and how many live sessions it renamed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentBlockedResult" }
        "400":
          description: A missing or non-boolean `blocked`, or an unparseable body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NoSuchAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

  /agent-worktrees/{agentId}/cleanup-check:
    get:
      tags: [agent worktrees]
      operationId: agentCleanupCheck
      summary: What removing the agent would lose.
      description: |
        Uncommitted changes and commits no remote branch has, per repository. A commit on a
        detached HEAD is unpushed work too, reported with no `branch`. In the wrapper a moved
        gitlink does not count: it is the trace of submodule work, and each submodule is checked on
        its own. `clean` is true when both lists are empty.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupCheck" }
        "404": { $ref: "#/components/responses/NoSuchAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

  /agent-worktrees/{agentId}/files:
    get:
      tags: [files]
      operationId: listFiles
      summary: One level of the working tree.
      description: |
        Lists one level of the agent's wrapper worktree plus the whole-tree generation token.
        `path` is relative to that worktree and optional — absent means the root level. Each
        submodule is the agent's own worktree of it, so an agent's submodule work shows here.

        **Submodules are part of the tree.** An initialized submodule's files (tracked and new
        untracked, its own gitignore honoured) are listed eagerly under their workspace-relative
        paths, recursively — never as the bare gitlink path, which a client would render as a file
        that 404s on open. A submodule with no checkout behind its gitlink comes back as a lazy
        stub instead.

        **Lazy directories are otherwise the gitignored ones.** There is no separate "ignored"
        flag: a directory that git does not track is returned as a stub with its immediate child
        count rather than being walked, and the caller asks for it by path when the user expands
        it.

        `.git` is refused like anything outside the root.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/RelativePath"
      responses:
        "200":
          description: The level, and the token it was computed under.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileListing" }
        "400": { $ref: "#/components/responses/BadPath" }
        "404":
          description: The path names nothing, or the agent has no worktree here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

  /agent-worktrees/{agentId}/files/content:
    get:
      tags: [files]
      operationId: readFile
      summary: One file's text.
      description: |
        Reads **any regular file inside the root, tracked or not** — no git consultation at all, so
        a path that only exists in the working tree (a log, a generated file) resolves.

        Two cases arrive identically as `binary: true` with no `content`: a file that is genuinely
        binary, and one over the 2 MB cap. The cap **soft-degrades** rather than answering 413, so
        a client cannot distinguish them from the body alone.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: Relative to the agent's wrapper worktree. Required here, unlike on `files`.
      responses:
        "200":
          description: The file, or the binary flag standing in for it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileContent" }
        "400": { $ref: "#/components/responses/BadPath" }
        "404":
          description: The path names nothing, or the agent has no worktree here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

  /agent-worktrees/{agentId}/detection:
    get:
      tags: [files]
      operationId: detect
      summary: Frameworks, projects and the source-to-test graph.
      description: |
        Carries a `generation` token computed by a **byte-identical duplicate** of the algorithm
        `/files` uses — a sha256 over the deduped, sorted path list of the whole tree, submodules
        walked like the listing walks them.

        That is not decoration. `/files` and `/detection` are two independently-fetched views over
        one mutable tree, and applying a detection result to a tree it was not computed from makes
        the UI flicker in a way that is very hard to diagnose later. **Apply a detection only while
        its token matches the tree currently rendered; on a mismatch hold the last consistent
        result rather than blanking it.** The tokens agree on first load, so there is no initial
        flash.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The detection result and its token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Detection" }
        "404": { $ref: "#/components/responses/NoSuchAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

  /agent-worktrees/{agentId}/component-map:
    get:
      tags: [files]
      operationId: componentMap
      summary: The UI components a framed pick can be attributed to.
      description: |
        Angular only today; `framework` says which scanner produced the map, and a tree it does not
        recognise answers `components: []` rather than an error.

        Fetch it once per pick-mode activation, not per pick — a map that misses a just-created
        component simply skips attribution.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The map.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentMap" }
        "404": { $ref: "#/components/responses/NoSuchAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/AgentsUnavailable" }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `qits.workspace-daemon.api-token`, injected per container as
        `QITS_WORKSPACE_DAEMON_API_TOKEN`. Compared in constant time and never logged or echoed.
        Required on both websocket handshakes as well.

  parameters:
    RelativePath:
      name: path
      in: query
      required: false
      schema: { type: string }
      description: |
        Relative to the agent's wrapper worktree. Absent means the root level. Traversal, absolute paths, symlinks
        (named outright *or* as an intermediate segment) and `.git` are all refused with a `400`.

    CommandId:
      name: commandId
      in: path
      required: true
      schema: { type: string }
      description: The daemon-generated command id.

    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
      description: |
        The agent worktree's id, as the host assigned it (a UUID). It names a directory, so any
        other shape is refused.

  responses:
    Unauthorized:
      description: |
        No bearer, or the wrong one. The body is identical whatever the path, so this port is never
        a path-existence oracle.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MethodNotAllowed:
      description: The route exists but not for this method.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: An unparseable query parameter or request body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadPath:
      description: |
        A path the browser refuses to resolve — traversal, absolute, a symlink, or `.git`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The path names nothing, or the endpoint does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoSuchCommand:
      description: No command with that id in this container's store.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CommandsUnavailable:
      description: Commands are not wired yet. Retryable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AgentsUnavailable:
      description: |
        Coding agents are not wired yet — the base clone is still being made, say. Retryable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoSuchAgent:
      description: |
        No worktree for that agent here, or (for a turn, the entity and yield) an agent this process
        has not started since it came up. Start it with `POST /agent-worktrees`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:

    Error:
      type: object
      description: |
        The one error shape every non-2xx answer uses. A single field on purpose: this API serves
        an untrusted checkout to a caller that is not the end user, so the body carries what the UI
        needs to render its states and nothing about the container's filesystem beyond the path the
        caller already named. An unexpected exception is logged in the container and returns
        "Internal error".
      required: [message]
      properties:
        message: { type: string }

    # --- an agent's files ------------------------------------------------------------------------

    FileListing:
      type: object
      required: [paths, lazyDirs, generation]
      properties:
        paths:
          type: array
          items: { type: string }
          description: Workspace-root-relative file paths at this level.
        lazyDirs:
          type: array
          items: { $ref: "#/components/schemas/LazyDir" }
        generation: { $ref: "#/components/schemas/Generation" }

    LazyDir:
      type: object
      description: |
        A gitignored directory, returned as a stub rather than walked. There is no separate
        "ignored" flag — being lazy *is* the flag.

        No `href`: the host's DTO carries one, but it is built from repository and workspace ids
        this daemon is not the authority on, so its controller synthesizes it from `path` instead.
      required: [path, childCount]
      properties:
        path: { type: string }
        childCount:
          type: integer
          description: Immediate children only, not a recursive count.

    FileContent:
      type: object
      required: [path, binary]
      properties:
        path: { type: string }
        binary:
          type: boolean
          description: |
            True for a genuinely binary file **and** for one over the 2 MB cap — the cap
            soft-degrades rather than answering 413, so the two are indistinguishable from the body
            alone. Say "too large or binary" unless the size is knowable another way.
        content:
          type: string
          description: Omitted entirely when `binary` is true.

    Generation:
      type: string
      description: |
        A sha256 over the deduped, sorted path list of the whole tree — `git ls-files` walked
        through every initialized submodule. `/files` and `/detection` compute it with
        byte-identical implementations, so a matching pair is proof the two views describe the
        same tree.

    Detection:
      type: object
      required: [projects, frameworks, links, generation]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/DetectionProject" }
        frameworks:
          type: array
          items: { $ref: "#/components/schemas/FrameworkMembership" }
        links:
          type: array
          items: { $ref: "#/components/schemas/FileLink" }
          description: The source-to-test graph.
        generation: { $ref: "#/components/schemas/Generation" }

    DetectionProject:
      type: object
      required: [root, frameworkId, label]
      properties:
        root:
          type: string
          description: Workspace-root-relative; the empty string for the repository root itself.
        frameworkId: { type: string, examples: ["java-quarkus", "angular", "docs"] }
        label: { type: string, examples: ["Java / Quarkus"] }

    FrameworkMembership:
      type: object
      description: Which files belong to one detected framework, for the tree's quick-access filters.
      required: [frameworkId, root, label, memberPaths]
      properties:
        frameworkId: { type: string }
        root: { type: string }
        label: { type: string }
        memberPaths:
          type: array
          items: { type: string }

    FileLink:
      type: object
      description: One source file and the tests that reach it.
      required: [path, tests]
      properties:
        path: { type: string }
        projectRoot:
          type: string
          description: The owning project's root; omitted when no project owns the file.
        tests:
          type: array
          items: { $ref: "#/components/schemas/TestLink" }

    TestLink:
      type: object
      required: [path, kinds]
      properties:
        path: { type: string }
        kinds:
          type: array
          items: { type: string, examples: ["junit", "vitest"] }

    ComponentMap:
      type: object
      required: [framework, components]
      properties:
        framework:
          type: string
          description: Which scanner produced the map.
          examples: ["angular"]
        components:
          type: array
          items: { $ref: "#/components/schemas/ComponentMapEntry" }
          description: Empty for a tree the scanner does not recognise — not an error.

    ComponentMapEntry:
      type: object
      required: [className, componentFile, styleFiles, selectors]
      properties:
        className: { type: string }
        componentFile: { type: string }
        templateFile:
          type: string
          description: Omitted for an inline template.
        styleFiles:
          type: array
          items: { type: string }
        selectors:
          type: array
          items: { $ref: "#/components/schemas/ComponentSelector" }

    ComponentSelector:
      type: object
      description: |
        **Either half may be absent**, and the parser is deliberately dumb about it: `app-foo` is
        element-only, `[appFoo]` attribute-only, `button[appFoo]` both. Anything else (`.class`,
        `:not(…)`) is skipped rather than guessed at. An attribute selector carrying a value is
        reduced to its name.
      properties:
        element: { type: string, examples: ["app-greeting"] }
        attribute: { type: string, examples: ["appHighlight"] }

    # --- commands ----------------------------------------------------------------------------

    CommandStatus:
      type: string
      enum: [RUNNING, EXITED, TERMINATED, INTERRUPTED]

    CommandKind:
      type: string
      description: |
        What the frontend routes its view on. `TERMINAL` is an interactive PTY streamed to xterm.js;
        `CHAT` is a coding-agent session over line-delimited JSON on pipes.
      enum: [TERMINAL, CHAT]

    LogChannel:
      type: string
      enum: [STDIN, OUTPUT, STDERR, TRANSCRIPT]

    LogSeverity:
      type: string
      description: Never emitted by this daemon; see `GET /commands/{id}/log`.
      enum: [INFO, WARNING, ERROR]

    CommandEnvelope:
      type: object
      description: |
        The single-command envelope `POST /agents/sign-in` answers with, kept so the host's
        request/response records reconstruct unchanged.
      required: [command]
      properties:
        command: { $ref: "#/components/schemas/Command" }

    CommandList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/CommandEnvelope" }
          description: |
            Newest first. Each row keeps the `{command: …}` envelope rather than being a bare
            command, which is the host's list shape.

    Command:
      type: object
      description: |
        `repoId` and `workspaceId` are **synthesized**: they are on the host's DTO but not on the
        daemon's record, because inside the container they are ambient. `shortCommitHash` is
        likewise reproduced here — it was a mapper expression on the host rather than a stored
        column, and leaving it out would silently empty the Commands list's commit column.
      required:
        [id, repoId, workspaceId, branch, actionName, status, interactive, kind, launchedAt, agentSessions]
      properties:
        id: { type: string }
        repoId: { type: string }
        workspaceId: { type: string }
        branch: { type: string }
        actionName: { type: string }
        actionId:
          type: string
          description: Omitted for a run with no declared action behind it.
        status: { $ref: "#/components/schemas/CommandStatus" }
        interactive: { type: boolean }
        kind: { $ref: "#/components/schemas/CommandKind" }
        launchedAt: { type: string, format: date-time }
        finishedAt:
          type: string
          format: date-time
          description: Omitted while running.
        exitCode:
          type: integer
          description: Omitted while running, and for a command that never produced one.
        commitHash:
          type: string
          description: The checkout's HEAD at launch; omitted when unknown.
        shortCommitHash:
          type: string
          description: The first seven characters of `commitHash`; omitted with it.
        agentSurface:
          $ref: "#/components/schemas/AgentSurface"
          description: |
            Where this session was started from, as the launch resolved it. **Omitted** for a
            non-agent command, for the sign-in terminal, and for every agent command launched
            before this daemon learned to accept the field — so a reader can tell "not an agent
            session" from "an agent session that predates the surface".

            This is what lets a caller stop matching a display string: before it, the only surface
            distinction that existed was carried in `actionName`.
        agentLaunchRecord:
          $ref: "#/components/schemas/AgentLaunchRecord"
          description: |
            What this session was **actually launched with**. **Omitted** for a non-agent command,
            for the sign-in terminal, and for every agent command launched before a launch recorded
            itself — omitted rather than null, so "no record" stays distinguishable from a session
            that ran with an empty configuration.
        agentSessions:
          type: array
          items: { $ref: "#/components/schemas/AgentSessionRef" }
          description: |
            The ordered session lineage this command drove; empty for a non-agent command. The
            **last** entry is the current session.

    AgentLaunchRecord:
      type: object
      description: |
        What a session was **actually launched with**, recorded on the command at launch rather
        than inferred afterwards from what the store holds.

        This is what makes "a container keeps the document it was born with, and an edit applies to
        the next container" a safe rule rather than an opaque one. The store can be edited at any
        time and the container is gone by the time anyone asks, so a session that behaved oddly
        last week cannot be read off the store — only off this. It is also the evidence the epic's
        per-surface rollout verification reads, in place of logs.

        **No credential can appear in it, structurally.** Attached external MCP servers are named
        by `externalMcpServers` **key** — not by url, not by header name, not by a redacted value —
        so there is no shape here one could travel in. (The rendered command line beside it is
        stored already redacted, for the same reason and by a different mechanism.)

        The daemon serves the library's own object unreshaped; the keys below are its.
      required:
        [surface, harness, model, effort, permissionMode, remoteControl, remoteControlName,
         activityTracking, mcpServers, externalMcpServers, configured, notes]
      properties:
        surface: { $ref: "#/components/schemas/AgentSurface" }
        harness: { $ref: "#/components/schemas/AgentType" }
        model:
          type: string
          description: The model passed, or **empty** for the harness's own default.
        effort:
          type: string
          description: |
            The effort level passed, or empty. Empty on a Kimi session even when one was
            configured — Kimi has no effort concept, and `notes` says so rather than the record
            claiming a flag that was never rendered.
        permissionMode:
          type: string
          enum: [SKIP_PERMISSIONS, PROMPT]
        remoteControl:
          type: boolean
          description: Whether the surface's remote-control knob was on.
        remoteControlName:
          type: string
          description: |
            The session name a bridge was asked for under, or empty when none was. Claude only.
        activityTracking:
          type: boolean
          description: Whether the turn-boundary hooks were wired.
        mcpServers:
          type: array
          description: The platform's own servers this launch attached, in render order.
          items:
            type: object
            required: [server, readOnly]
            properties:
              server:
                type: string
                description: "`repository`, `observability` or `actions`."
              readOnly:
                type: boolean
                description: Whether the url carried the `agentReadOnly=true` fence.
        externalMcpServers:
          type: array
          items: { type: string }
          description: |
            The catalog entries this launch attached, **by key**. Never a url and never a header
            value — see this schema's note.
        configured:
          type: boolean
          description: |
            `false` when the launch rendered the library's shipped constants because its container
            was born without a configuration document — the difference between "configured this
            way" and "nobody had configured it", which a reader cannot otherwise tell.
        notes:
          type: array
          items: { type: string }
          description: |
            What the harness could not render of what it was configured with (a Kimi effort level,
            a Kimi system prompt), and anything else the launch wants a reader to know.

    AgentSessionRef:
      type: object
      required: [sessionId, source, recordedAt]
      properties:
        sessionId: { type: string }
        source: { $ref: "#/components/schemas/AgentSessionSource" }
        forkedFromSessionId:
          type: string
          description: Set on `FORKED` entries only; omitted otherwise.
        transcriptPath:
          type: string
          description: |
            The harness's own reported JSONL path, authoritative over the computed convention.
            Omitted until the `SessionStart` hook's first report.
        recordedAt: { type: string, format: date-time }

    AgentSessionSource:
      type: string
      description: |
        How the entry entered the list. `PINNED` at launch, `RESUMED`/`FORKED` for an explicit
        continuation, `REPORTED` when the harness's hook established a session the daemon could not
        pin, and `SWITCHED` when the user changed sessions inside the interactive TUI — which is
        what keeps the list a faithful order of the sessions actually driven.
      enum: [PINNED, RESUMED, FORKED, SWITCHED, REPORTED]

    CommandLog:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/CommandLogLine" }

    CommandLogLine:
      type: object
      required: [sequence, channel, content, timestamp]
      properties:
        sequence:
          type: integer
          format: int64
          description: The monotonic per-command ordinal, assigned at capture. The stable sort key.
        channel: { $ref: "#/components/schemas/LogChannel" }
        content:
          type: string
          description: The raw line, which may contain ANSI escapes.
        severity:
          $ref: "#/components/schemas/LogSeverity"
          description: Always omitted on this daemon — nothing classifies.
        timestamp: { type: string, format: date-time }

    # --- coding agents -----------------------------------------------------------------------

    AgentType:
      type: string
      enum: [CLAUDE, KIMI]

    AgentLaunchMode:
      type: string
      description: |
        `CHAT` is the stream-json conversation over pipes (`command.kind` `CHAT`, `WS
        /chat/commands/{id}`); `INTERACTIVE` is the full agent TUI over a PTY (`command.kind`
        `TERMINAL`, `WS /terminal/commands/{id}`).
      enum: [CHAT, INTERACTIVE]

    AgentSurface:
      type: string
      description: |
        Where in the product this session was started from — what it is steered at and what its
        configuration is keyed by: which prompt, model, permissions and servers it runs with. An
        agent worktree runs on `ticket.dispatch` unless its start names another.

        The five a workspace container serves are `epic.chat`, `epic.agent`, `workspace.chat`,
        `workspace.agent`, and `ticket.dispatch` where a ticket dispatch cut the workspace; the
        vocabulary is the platform's whole set, so the other two — `project.work` and
        `epic.autonomous` — are accepted by validation and simply never sent by this daemon.

        **The four human ones would send byte-identical requests without this field**, which is why
        it exists: `epic.chat` and `workspace.chat` differ only in which container the request
        reached, and nothing downstream could tell them apart.
      enum:
        - project.work
        - epic.chat
        - epic.agent
        - workspace.chat
        - workspace.agent
        - epic.autonomous
        - ticket.dispatch

    SignInRequest:
      type: object
      description: |
        Optional whole. The usual caller is "the harness I was just refused for", which it knows
        from the `409`'s `agentType`; an operator opening the door on a fresh estate should not have
        to name one.
      properties:
        agentType:
          $ref: "#/components/schemas/AgentType"
          description: Omit to take the resolved default.

    AgentTurnRequest:
      type: object
      description: |
        One user turn, delivered verbatim. There is nothing else in it on purpose: the daemon does
        not know what the text is for, does not template it and does not parse it, so a field naming
        an intent would be a field nothing here could act on.
      required: [text]
      properties:
        text:
          type: string
          description: |
            The turn. Blank is a `400`, not a delivered no-op — an empty chat turn is one the
            harness will answer, and an empty terminal turn is a bare Enter into whatever holds the
            prompt. Neither is what an empty string meant.

    AgentTurnResult:
      type: object
      description: Where a turn went. Every key is present, `commandId` and `kind` once there was one.
      required: [delivered, restarted]
      properties:
        delivered:
          type: boolean
          description: |
            Whether the bytes were accepted for a live session. **Not** whether a prompt consumed
            them: a TUI that is still starting has no prompt to type into yet.
        restarted:
          type: boolean
          description: |
            True when the harness was not running and was started again for this turn — resuming
            its session when the session's files were there — with the text as its opening turn.
        commandId:
          type: string
          description: The command the turn went to — after a restart, the new one.
        kind:
          $ref: "#/components/schemas/CommandKind"
          description: |
            Which arm carried it. `CHAT` read the text off stdin; `TERMINAL` had it typed into a
            prompt, and the two fail differently.

    AgentBlockedRequest:
      type: object
      description: |
        Whether this container's entity is BLOCKED, whole. Required and must be a JSON boolean — a
        `400` for a missing or mistyped field rather than guessing which state was meant.
      required: [blocked]
      properties:
        blocked:
          type: boolean
          description: The new marker. Stored before any session is renamed, so it is never stale.
        blockSource:
          type: [string, "null"]
          description: |
            Why it is blocked: `EXPLICIT`, `AGENT_WAITING` or `BOTH`; null or absent is explicit.
            Passed through untouched — the library alone decides that `AGENT_WAITING` draws `⁉️`.

    AgentEntityRequest:
      type: object
      description: |
        What this container's entity is now, whole. `blocked` is required and a JSON boolean;
        `title` and `status` are each a string, or null/absent for "not known". Any other type is a
        `400` rather than a coercion.
      required: [blocked]
      properties:
        title:
          type: [string, "null"]
          description: The entity's title. Sanitised and truncated by the library when rendered.
        status:
          type: [string, "null"]
          description: |
            The entity's status word (e.g. `IMPLEMENTING`), passed through untouched. The library
            picks the square it draws; a word it does not know draws none.
        blocked:
          type: boolean
          description: Whether the entity is BLOCKED — the leading `❗` (or `⁉️`).
        blockSource:
          type: [string, "null"]
          description: |
            Why it is blocked: `EXPLICIT`, `AGENT_WAITING` or `BOTH`; null or absent is explicit.

    AgentEntityResult:
      type: object
      description: The facts this call stored, and how many live sessions carry the name they render.
      required: [title, status, blocked, blockSource, renamed]
      properties:
        title:
          type: [string, "null"]
          description: Echoes the request; present as null when not known, never omitted.
        status:
          type: [string, "null"]
          description: Echoes the request; present as null when not known, never omitted.
        blocked:
          type: boolean
          description: Echoes the request.
        blockSource:
          type: [string, "null"]
          description: Echoes the request; present as null when not given, never omitted.
        renamed:
          type: integer
          description: |
            Live chats renamed now, plus live interactive sessions renamed now, queued for their
            next idle moment, or already carrying the name. `0` is a normal answer and always present.

    AgentBlockedResult:
      type: object
      description: |
        The marker this call left standing, and how many live Claude Remote Control sessions it
        renamed to match.
      required: [blocked, renamed]
      properties:
        blocked:
          type: boolean
          description: Echoes the request — what every launch from here on renders.
        renamed:
          type: integer
          description: |
            How many live sessions were renamed in place. `0` is a normal answer (nothing was
            running yet, or nothing was renameable) and is always present, never omitted, so a
            caller can tell "nothing to rename" from "the rename failed".

    NotSignedIn:
      type: object
      description: |
        The refusal a launch answers when nobody has signed the harness in. The unattended paths
        (`epic.autonomous`, `ticket.dispatch`) get the same refusal and must **not** be turned into
        a sign-in terminal: a dispatch that reports "started an agent" over a login prompt nobody
        will look at is the green-while-dead shape this replaced.
      required: [error, message]
      properties:
        error:
          type: string
          description: |
            The machine-readable discriminator, and the point of this body. Always `not-signed-in`.
          enum: [not-signed-in]
        agentType:
          $ref: "#/components/schemas/AgentType"
          description: Which harness has nobody signed in — what the sign-in terminal is opened for.
        message:
          type: string
          description: |
            Human-readable, and **not** a contract. Reworded freely; match `error` instead.

    AvailableAgents:
      type: object
      required: [agents, defaultAgent, imageVersion, reportedBy, capabilities]
      properties:
        agents:
          type: array
          items: { $ref: "#/components/schemas/AgentType" }
        defaultAgent: { $ref: "#/components/schemas/AgentType" }
        imageVersion:
          type: string
          description: |
            The workspace image this container runs — the second half of the host's cache key for
            `capabilities`, so a rebuilt image refreshes the catalogue rather than merging into it.
            `unknown` when the container was told nothing and the binary carries no build stamp.
        reportedBy:
          type: string
          description: |
            Which daemon answered, for display beside a cached report. Free text; nothing matches
            on it.
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/HarnessCapabilities" }
          description: |
            One report per harness, produced by running the binaries **once at container start**.
            Empty until that probe lands, and empty if it failed outright — a cache miss to the
            host, which keeps whatever it had rather than emptying the editor's dropdowns.

    HarnessCapabilities:
      type: object
      description: |
        What one harness in this image can be configured with. The two answer very differently,
        which is the whole reason this is a report rather than a list: Claude has `--effort` with
        levels its `--help` enumerates and **no command that lists models**, so its models are the
        shipped aliases and `modelsEnumerated` is always false; Kimi has a machine-readable model
        catalogue and **no effort concept at all**, so `effortSupported` is false and the editor
        shows no effort control rather than a disabled one carrying Claude's values.

        The report says which values it **enumerated**, not which are legal — a launch renders
        whatever string the configuration holds, so a full model id the harness never listed still
        works.
      required:
        [harness, harnessVersion, models, modelsEnumerated, effortSupported, effortLevels,
         authenticated, authDetail, probeFailed, probeDetail]
      properties:
        harness: { $ref: "#/components/schemas/AgentType" }
        harnessVersion:
          type: string
          description: What the binary reported as its version; empty when it could not be read.
        models:
          type: array
          items: { type: string }
        modelsEnumerated:
          type: boolean
          description: Whether `models` came off the binary rather than from the shipped set.
        effortSupported:
          type: boolean
          description: Whether this harness has the concept at all.
        effortLevels:
          type: array
          items: { type: string }
        authenticated:
          type: boolean
          description: |
            Whether anybody is signed in on the shared credential volume. **A display value, never
            a gate** — it is asked again at launch, so a sign-in a minute after this was taken is
            not blocked by it.
        authDetail:
          type: string
          description: Where to sign in, when nobody has.
        probeFailed:
          type: boolean
          description: |
            Whether this report fell back to the shipped set rather than reading the binary. A
            failed probe still yields a usable report; an empty dropdown is worse than a stale one.
        probeDetail:
          type: string
          description: Why it fell back; empty when it did not.

    AgentSessionTree:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/AgentSessionNode" }

    AgentSessionNode:
      type: object
      required: [sessionId, subagents, children]
      properties:
        sessionId: { type: string }
        firstRecordedAt:
          type: string
          format: date-time
          description: Omitted when nothing has dated the session yet.
        forkedFromSessionId:
          type: string
          description: The fork edge; omitted on a root.
        messageCount:
          type: integer
          description: |
            **Omitted means "not swept yet"**, which is not the same as a swept zero and should
            render differently. The count is filled in by the transcript sweep on exit.
        newestCommandId:
          type: string
          description: The most recent command that drove this session — the re-attach target.
        subagents:
          type: array
          items: { $ref: "#/components/schemas/AgentSubagent" }
          description: |
            The side-chains this session's `Task` calls spawned. Flat, one level deeper than
            `children`, and populated **only after the exit sweep** — a live session shows its main
            thread and gains its side-chains when the run ends. Say so in the UI rather than
            looking broken.
        children:
          type: array
          items: { $ref: "#/components/schemas/AgentSessionNode" }
          description: Recurses to arbitrary depth. Always present, `[]` at a leaf.

    AgentSubagent:
      type: object
      required: [agentId, messageCount]
      properties:
        agentId: { type: string }
        messageCount: { type: integer }
        agentType:
          type: string
          description: |
            The sub-agent's declared type. Agent-produced free text, clamped to 255 characters;
            omitted when the side-chain declared none.
        description:
          type: string
          description: Agent-produced free text, clamped to 1024 characters. Omitted when absent.
        firstTimestamp: { type: string, format: date-time }

    PluginList:
      type: object
      required: [installed]
      properties:
        installed:
          type: array
          items: { $ref: "#/components/schemas/InstalledPlugin" }

    InstalledPlugin:
      type: object
      required: [pluginId, enabled]
      properties:
        pluginId:
          type: string
          description: The marketplace-qualified id, as the volume records it.
          examples: ["jdtls-lsp@claude-plugins-official"]
        enabled:
          type: boolean
          description: False means installed but switched off, which is distinct from absent.

    RefinementRequest:
      type: object
      required: [transcript]
      properties:
        transcript:
          type: string
          description: The rough text to rewrite. Blank is a `400`.
        preamble:
          type: string
          description: Optional extra instruction prepended to the refinement request.

    Refinement:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }

    # --- agent worktrees -----------------------------------------------------------------------

    AgentWorktreeStart:
      type: object
      description: |
        What the host knows about the agent, whole. The credential travels in `env` and nowhere
        else.
      required: [agentId, workId, wrapperBranch]
      properties:
        agentId:
          type: string
          description: The agent row's id; names the agent's directory.
        workId:
          type: string
          description: The top-level work item (`<project>-<n>`) the agent works on.
        entityId:
          type: string
          description: The entity the session is named for; usually the same as `workId`.
        wrapperBranch:
          type: string
          description: |
            `<prefix>/<workId>`. The wrapper worktree's branch; a submodule branch the agent makes
            is `<wrapperBranch>-<name>`. Must be a valid branch and not the default branch.
        harness:
          $ref: "#/components/schemas/AgentType"
          description: Omit to take the resolved default, or on a resume the session's own.
        sessionId:
          type: string
          description: |
            The session to resume, as the host stored it. Resumed only when its files are still
            there; otherwise a new session starts and its id comes back.
        env:
          type: object
          additionalProperties: { type: string }
          description: |
            The agent's credential (`QITS_TOKEN`, say), laid over the harness process's
            environment. Never written to disk; never served back.
        instruction:
          type: string
          description: The opening turn, on a fresh or a resumed session alike.
        surface:
          $ref: "#/components/schemas/AgentSurface"
          description: Omit for `ticket.dispatch`. An unknown one is a `400`.
        mode:
          $ref: "#/components/schemas/AgentLaunchMode"
          description: Omit for `CHAT`.
        entityTitle:
          type: string
          description: Seeds the session name; `POST …/entity` moves it later.
        entityStatus:
          type: string
          description: Seeds the session name, as `entityTitle`.
        entityBlocked:
          type: boolean
          description: Seeds the session name's blocked mark.
        blockSource:
          type: string
          description: Why it is blocked, as on `POST …/entity`.

    AgentWorktreeStarted:
      type: object
      required: [agentId, path, commandId, launched, resumed]
      properties:
        agentId: { type: string }
        path:
          type: string
          description: The agent's wrapper worktree — the harness's working directory.
        commandId:
          type: string
          description: The harness's command; attach to its socket by this id.
        launched:
          type: boolean
          description: False when a harness was already running and was left as it was.
        resumed:
          type: boolean
          description: True when the harness was started on the stored session.
        sessionId:
          type: [string, "null"]
          description: |
            The session the harness runs: the resumed one, or a new one. Null for a fresh Kimi
            session until its first hook reports it.

    AgentWorktree:
      type: object
      required: [agentId, path, harnessRunning, branches, dirty, unpushed]
      properties:
        agentId: { type: string }
        workId: { type: [string, "null"] }
        wrapperBranch: { type: [string, "null"] }
        path:
          type: string
          description: The agent's wrapper worktree.
        harnessRunning: { type: boolean }
        commandId:
          type: [string, "null"]
          description: The harness's last command, while this process knows it.
        sessionId:
          type: [string, "null"]
          description: |
            The agent's current session — kept current from the harness's hooks, so a Kimi session
            or an in-session `/resume` is reflected.
        branches:
          type: array
          items: { $ref: "#/components/schemas/AgentBranch" }
          description: |
            One entry per repository whose worktree is on a branch: the wrapper first, then each
            submodule the agent branched in. A detached submodule is not listed.
        dirty:
          type: boolean
          description: Any repository has uncommitted changes.
        unpushed:
          type: boolean
          description: Any repository has commits no remote branch has.

    AgentBranch:
      type: object
      required: [repository, path, branch, head, pushed]
      properties:
        repository:
          type: string
          description: |
            The repository's name on the git host: the wrapper's, or the name a submodule's origin
            points at. The same value `AgentBranchPushed` carries on the control socket.
        path:
          type: string
          description: The submodule's path in the wrapper; empty for the wrapper.
        branch: { type: string }
        head: { type: string }
        pushed:
          type: boolean
          description: The git host's branch is at `head`.

    CleanupCheck:
      type: object
      required: [clean, dirty, unpushed]
      properties:
        clean:
          type: boolean
          description: Nothing would be lost; both lists are empty.
        dirty:
          type: array
          items: { type: string }
          description: The repositories with uncommitted changes, by name.
        unpushed:
          type: array
          items: { $ref: "#/components/schemas/UnpushedWork" }

    UnpushedWork:
      type: object
      required: [repository, branch, commits]
      properties:
        repository: { type: string }
        branch:
          type: [string, "null"]
          description: Null for a commit on a detached HEAD, which is never pushed.
        commits:
          type: integer
          description: Commits on HEAD that no remote branch has.

    AgentYielded:
      type: object
      required: [agentId, yielded]
      properties:
        agentId: { type: string }
        yielded:
          type: boolean
          description: A running harness was stopped; false when none was running.

    AgentRemoved:
      type: object
      required: [agentId, removed]
      properties:
        agentId: { type: string }
        removed: { type: boolean, const: true }

x-websockets:
  description: |
    Two sockets, served on this same server beside the REST routes and reached through the same
    proxy. **Not over the control socket, deliberately**: that protocol's command triple is
    fire-and-collect — no stdin, no resize — so carrying an interactive terminal over it would mean
    new message types and a capability bump for something this HTTP server already does.

    Both authenticate at the **handshake**, with the same `Authorization: Bearer` header. An
    unauthenticated caller never gets a socket (`401` at the upgrade); a path that names no command
    is rejected `404` there too, so a caller learns nothing about which commands exist.

    Both are keyed by command id. **Key your client component by command id as well** — a relaunch
    must recreate the terminal rather than reuse a socket bound to a dead process.

    **Closing detaches; it never terminates.** That is what makes a command survive a browser
    refresh. To actually stop a process, call `POST /commands/{id}/terminate`.

    Attaching to a command the registry no longer holds live gets a refusal in that socket's own
    dialect and then a close — the caller's cue to fall back to `GET /commands/{id}/log` rather
    than wait forever on a stream that will never speak.

  channels:

    terminal:
      path: /terminal/commands/{commandId}
      summary: An interactive PTY, for xterm.js.
      onAttach: |
        Replays 256 KB of scrollback, then streams live.
      clientToServer:
        - type: data
          shape: '{"type":"data","data":"<text>"}'
          description: Keystrokes, written to the PTY.
        - type: resize
          shape: '{"type":"resize","cols":<int>,"rows":<int>}'
          description: |
            A missing dimension falls back to 80x24 rather than producing a zero-sized terminal.
        - type: "(anything else)"
          description: |
            Silently ignored. An unknown type is a newer client, not a fault — and an undecodable
            frame is dropped rather than closing the socket.
      serverToClient: |
        Raw PTY text, not JSON. Write it straight into the emulator.
      gone: |
        A command that is no longer running is told so as literal bytes the terminal renders as its
        familiar yellow line — `\r\n\u001b[33mThis command is no longer running.\u001b[0m\r\n` —
        and the socket is closed only once that has actually gone out.
      reconnect: |
        A clean server close (1000) is final: print `[disconnected]` and stop. Everything else
        reconnects with exponential backoff capped around 4 s, about five attempts, each attempt
        resetting the terminal and letting the replay repaint it. **Re-arm a spent budget on
        `visibilitychange` and on `online`** — a laptop sleep outlives an eight-second window, and
        "I'm back" is an event rather than something to poll for.

    chat:
      path: /chat/commands/{commandId}
      summary: A coding-agent conversation, as newline-delimited JSON.
      onAttach: |
        **Replays the whole conversation**, not just a tail: the imported transcript head is
        stitched to a 256 KB ring tail at the first ring line whose `uuid` the transcript already
        contains, under the session lock, so every event replays exactly once. Re-attaching
        therefore costs nothing and is the normal way to recover.
      clientToServer:
        - type: user
          shape: '{"type":"user","text":"<message>"}'
          description: |
            The only frame the server acts on. Anything else is ignored, as on the terminal.
      serverToClient: |
        One JSON object per line — the harness's own `stream-json` events, passed through (Kimi's
        ACP events are normalized to the same envelope first), plus qits' own synthetic lines.

        **Render the user's own turn from the server's echo, never optimistically.** The daemon
        emits a synthetic `{"type":"user","text":…}` for every message sent, and rendering from it
        is what guarantees the live view and a later replay show the same things in the same order.

        Sub-agent side-chains are announced by a synthetic anchor line immediately before each one:

            {"type":"qits_agent_meta","agentId":"…","agentType":"…","description":"…","toolUseId":"…"}

        `agentType` and `description` are agent-produced free text (clamped to 255 and 1024
        characters) and either may be absent. **`toolUseId` is the `Task` tool call that spawned
        the side-chain** — fold the side-chain into a collapsible group anchored on that call. A
        side-chain whose anchor is missing has nowhere to attach and should be appended at the end
        rather than dropped.

        Side-chains join **only after the exit sweep**: the live tail covers the main session only.
      gone: |
        A command that is no longer running is told so as an envelope, because a chat client parses
        rather than prints: `{"type":"session_closed"}`, then the close.
      reconnect: |
        Auto-reconnect on close after about 1.5 s. Queue messages sent while down and flush them on
        open; a send while closed triggers an immediate reconnect attempt. The full replay on
        attach is what makes this safe.
