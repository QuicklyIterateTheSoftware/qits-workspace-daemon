# ForeignPty is initialized at RUN TIME, against the builder's default of build time.
#
# Its static initializer calls Linker.downcallHandle, and a MethodHandle built in the builder is
# what the image heap cannot carry: analysis reaches the invokeExact site, tries to lower the
# linkToNative behind it, and aborts the whole build with
#
#     should not reach here: unexpected input could not be handled: linkToNative
#
# Registering the descriptors (reachability-metadata.json, next to this file) does NOT fix that on
# its own -- with the stubs registered and the class still initialized at build time, the build
# fails identically. Both halves are needed, and they fix different things: this line makes the
# build succeed, the metadata makes the binary work.
#
# Quarkus initializes application classes at build time and passes its own
# --initialize-at-build-time on the command line. An exact class name is more specific than that
# blanket list, so this wins
# without Quarkus having to be told anything -- which is why the fix lives in this module, next to
# the class it is about, rather than in workspace-daemon's application.properties.
Args = --initialize-at-run-time=eu.wohlben.qits.workspacedaemon.commands.ForeignPty
