# workspace-daemon — the in-container client daemon (docs/epics/qits-workspace-daemon/).
# A command-mode app with NO web stack and NO datasource: it dials home over a WebSocket and runs
# qits' in-container work. All identity/reachability is injected as container env by
# WorkspaceContainerFactory (QITS_WORKSPACE_DAEMON_* -> qits.workspace-daemon.*), so this file only carries defaults
# and logging.

# The dial-home URL (ws://<qitsHost>:<port>/workspaces/daemon/<workspaceId>) and identity are supplied by
# the factory as env at container creation. Left unset here on purpose: a workspace-daemon that boots without
# them logs and stays idle (the container must not die for want of a socket). The daemon dials the
# url verbatim and parses no path out of it — the shape above is qits-workspaces' control socket,
# recorded so this file reads against the same convention as everything else.
# qits.workspace-daemon.url=
# qits.workspace-daemon.workspace-id=
# qits.workspace-daemon.repository-id=
# qits.workspace-daemon.branch=
# qits.workspace-daemon.parent=
# project-scoped name the daemon self-clones under (<gitBase>/<projectId>/<repoName>) so relative
# submodule urls resolve natively; blank ⇒ id-addressed clone (<gitBase>/<repositoryId>).
# qits.workspace-daemon.project-id=
# qits.workspace-daemon.repo-name=

# The git host the boot self-clone reads from: qits-artifacts, which serves /artifacts/git/... —
# under that prefix through the gateway AND when dialled directly on qits-net, so the prefix is not
# something an in-network client may drop. Unset ⇒ Provisioner derives <dial-home authority>/artifacts/git
# and emits a WARN saying so, because the control socket is a DIFFERENT service (qits-workspaces) and
# the derivation only holds where one authority routes every segment. See Provisioner's javadoc.
# qits.workspace-daemon.git-base-url=

# The MCP servers an agent launch is wired with, one key per server name. Same story as the git host:
# `repository` is qits-projects at /projects/mcp and `observability` is qits-observability at
# /observability/mcp — two more hosts the daemon is not told about. Unset ⇒ derived from the dial-home
# authority, with a WARN naming each server that was guessed at.
#
# `actions` has NO derivable form: no service in the split serves it (the tools are still
# monolith-only, migration-plan.md §9 item 6). Unset means an ACTIONS-scope launch fails with that
# message rather than pointing the agent at a 404 it would report as a missing tool.
# qits.repository-mcp.url=
# qits.observability-mcp.url=
# qits.actions-mcp.url=

# Build identity, filtered in at build time (@-delimited, see pom.xml) and announced in the Hello
# (docs/epics/qits-workspace-registry/). `version` is the Maven project.version (distinguishes
# numbered releases); `build.time` is the build timestamp (distinguishes floating -SNAPSHOT builds).
# Baked into the native image as config, so the daemon reports them with no runtime file read.
qits.workspace-daemon.build.version=@project.version@
qits.workspace-daemon.build.time=@timestamp@

# Liveness ping cadence and the reconnect backoff ceiling.
qits.workspace-daemon.heartbeat-interval-ms=20000
qits.workspace-daemon.reconnect-max-backoff-ms=30000

# Loopback port the in-container coding-agent lifecycle hooks POST to (HookWebhook — the daemon's only
# inbound listener; agent-activity tracking). Must match the port AgentLaunchService renders into the
# hook curl. Bound to 127.0.0.1 only, so it's reachable from the agent process in the same container
# and from nowhere else.
qits.workspace-daemon.hooks-port=13337

# The daemon's API over its checkout (WorkspaceApi): files, detection, commands, coding agents,
# services, the bootstrap chain and the two interactive websockets — the in-container replacement for
# what qits computed with per-request `docker exec`.
#
# LOOPBACK, like the hook webhook, and now for the same reason: the only client that reaches it
# shares the container's network namespace. That client is DaemonStreamTunnel, which dials OUT to
# qits when asked over the control socket and pipes the connection here. This used to bind 0.0.0.0,
# which made it reachable by DNS name from every other container on qits-net — every one of them
# running a coding agent over someone else's untrusted checkout, and able to read the shared token
# out of its own environment. A peer container's connection is now refused by the network stack
# rather than by a token check. Own port so the hook sink stays a separate surface.
qits.workspace-daemon.api-port=13338
qits.workspace-daemon.api-bind-address=127.0.0.1

# Where this API is mounted, as its caller addresses it — injected per container as
# QITS_WORKSPACE_DAEMON_API_BASE_PATH=/workspaces/container/<workspaceId>/, the path qits-workspaces'
# ContainerProxyRoute serves.
#
# It exists because NO HOP IN THE CHAIN REWRITES A PATH. The proxy forwards what the caller asked
# for, byte for byte, and the tunnel under it carries the request line verbatim — so the daemon is
# TOLD which leading part of that path is its own address rather than deriving one by stripping a
# segment or matching a shape. That is the same property the control-socket url has: handed over
# whole, dialled verbatim, never parsed. A hop that rewrote the path would leave the caller and the
# daemon disagreeing about this daemon's address, and that kind of disagreement surfaces a long way
# from the rewrite that caused it.
#
# Unset here on purpose: blank means "nothing fronts me", the routes are served exactly as
# WorkspaceApi spells them, and every direct caller — a test, a loopback probe — keeps working.
# qits-workspaces injects the real value; see ContainerProxyPath.base.
# qits.workspace-daemon.api-base-path=

# The per-workspace half of every web-viewable service's public base, injected per container as
# QITS_WORKSPACE_DAEMON_SERVICE_PROXY_BASE=/workspaces/service/<workspaceId> — the prefix
# qits-workspaces' ServiceProxyRoute answers under, verbatim.
#
# The daemon completes it per spawn with the segments it is the authority on — the declared
# service id and the declared web-view base-path — and bakes the result into the dev server's
# environment as QITS_PUBLIC_BASE. The proxy rewrites nothing, so the app can only be reached under
# the base it was told at spawn; an app that never learned it 404s the framed view (N3). Unset
# here on purpose: blank means "nothing fronts me", and a web-viewable spawn then warns and leaves
# QITS_PUBLIC_BASE unset rather than deriving an address from a sibling's.
# qits.workspace-daemon.service-proxy-base=

# The bearer every API request must present, injected per container as
# QITS_WORKSPACE_DAEMON_API_TOKEN like the rest of the daemon's identity. Left unset here on purpose,
# and unset means the API DOES NOT BIND (with a warning): an omitted env is indistinguishable from a
# misconfiguration, and this server hands out an untrusted checkout, so it must degrade to
# "unavailable" and never to "anonymous". Defence in depth behind the loopback bind, not the
# boundary — see WorkspaceApi's javadoc for why that distinction is worth keeping straight.
# qits.workspace-daemon.api-token=

# Name the compiled artifact `qits-workspace-daemon` (not workspace-daemon-<version>-runner): drop the -runner suffix
# and set the base name, so `-Dnative` produces target/qits-workspace-daemon directly — a qits-namespaced
# process name that's identifiable in `ps`/`docker top` as PID 1's child in every workspace container.
quarkus.package.output-name=qits-workspace-daemon
quarkus.package.jar.add-runner-suffix=false

# Keep the native image lean and quiet; logs also stream home as DaemonLog once connected.
quarkus.log.level=INFO
quarkus.banner.enabled=false

# --enable-native-access is NOT settable here, and that is the point of this note.
#
# ForeignPty calls libc through java.lang.foreign, a restricted method. The native image resolves
# native access at build time and needs nothing, and that is what ships (docker/qits/Dockerfile
# ENTRYPOINTs the native binary). But the daemon run as a JVM app warns on every PTY launch and,
# per the warning's own text, will be refused outright in a future release -- and a runner jar
# cannot add its own JVM flags, so no property fixes it. Pass it on the command line:
#
#     java --enable-native-access=ALL-UNNAMED -jar target/quarkus-app/quarkus-run.jar
#
# The surefire blocks in qits-commands, qits-coding-agents and workspace-daemon set it for tests,
# which is the other place a JVM opens a PTY.
