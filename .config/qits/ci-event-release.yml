# The release pipeline: this repository reacts to its OWN release TAG and pushes the workspace image
# under the released VERSION.
#
# THE SELECTION NAMES THIS REPOSITORY, WHICH READS LIKE A LOOP AND IS NOT — the same shape every
# sibling's release pipeline has. `SCMRelease` says only "this repository released this version",
# and qits-projects says it the instant the tag is written; nothing here releases anything. The
# event that could loop is `SoftwareRelease`, and this file neither listens for it nor emits it.
#
# THE VERSION TAG IS A COORDINATE BESIDE THE SHA, NOT A REPLACEMENT FOR IT. The QA pipeline
# (ci-event-release-request.yml) keeps pushing `:$QITS_CI_SHA` for every fold it builds green; what
# this adds is a name a human and a downstream consumer can say out loud, and it is the one a
# deployment asks for. The two coordinates have two owners — a build is named by its commit, a
# release by its version. One build, one name: the multi-tag hazard the old note here recorded was
# a property of the local image store, and under `push=true` there is no local store in the path at
# all — but a second name would still be a second declaration, so it stays one.
#
# ONE BUILD, THREE ARTIFACTS — and the number is not a regression to what was retired. Until
# 2026-08-10 this pipeline pushed a bare-binary IMAGE `qits/workspace-daemon` and then layered it
# into `qits/workspace`: two builds, two declarations, and a partial release possible between them.
# docker/Dockerfile does both halves in one build now. What the `artifacts:` list gained since is
# two exports OF THAT SAME BUILD — the bare daemon file and the pin-and-protocol jar — neither of
# which compiles anything a second time, and both of which exist so a CONSUMER can pin this release
# instead of being handed it. `artifacts:` says which; WorkspaceImage says why.
#
# `artifacts:` IS A DECLARATION, NOT A REPORT. qits-ci never learns how to publish anything — the
# `buildctl` push below is this repository's own step — so it cannot see what landed. It announces
# one `SoftwareRelease` per entry on the strength of this line once the whole pipeline is green.
# Keep it true.
#
# THE NAME IS UNQUALIFIED ON PURPOSE. No registry-qualified reference is portable here — the
# registry is one service under several addresses (`$QITS_BUILD_REGISTRY` to the platform builder,
# `$QITS_REGISTRY` to the host daemon and qits-deployments) — and an OCI reference cannot carry a
# path prefix. So the declaration carries `qits/workspace` and the reader supplies its own host,
# exactly as the step below composes one from environment.
#
# THE BUILD BELOW IS ci-event-release-request.yml's, AND THE TWO MUST STAY MATCHED — byte for byte
# in every buildctl argument, because the platform builder's cache is shared and a matched build is
# what makes a release that follows a green fold a stack of cache hits rather than a second native
# compile. That file explains the whole builder arrangement (`docker: true` as the declaration that
# injects `$BUILDKIT_HOST`, the file-form secrets, why there is no `--network host` any more); this
# one carries the short form and points there rather than keeping a second copy of the reasoning to
# drift.
#
# THE VERSION TAG IS STILL THE DURABLE STAMP, BUT IT NO LONGER TRIGGERS. Under the release-request
# flow the tag is written by qits-githost's tag primitive, which announces nothing — the trigger is
# qits-projects' `SCMRelease`. A bootstrap replay therefore re-establishes a release by pushing the
# tag quietly and re-presenting the `SCMRelease` through qits-ci's manual trigger door
# (`POST /ci/api/events/trigger`), which runs this same pipeline. qits-ci still announces
# `SoftwareRelease` only where a green run and an `SCMRelease` meet.
#
# THE FILE HAS TO BE IN PLACE BEFORE THE TAG IT SELECTS IS PUSHED. The bus is at-most-once with no
# catch-up and no replay, so a trigger file arriving after its event loses that release and looks
# like a train that quietly did not roll.
#
event: SCMRelease
when:
  # SCMRelease, not SCMPublishTag: under the release-request flow the version tag is written by
  # qits-githost's tag primitive, which fires no post-receive and so publishes no SCMPublishTag —
  # a recipe listening for the tag event never runs again. qits-projects' Auto Release publishes
  # SCMRelease carrying the repository's public name, and a bootstrap replay arrives as this same
  # event through qits-ci's manual trigger door. A rename updates this line in the same campaign.
  - repository: { exact: qits-workspace-daemon }
# THE RUN IS ANCHORED AT THE TAG IT BUILDS. `SCMRelease` carries `commitSha` — the commit the tag
# points at — since qits-projects 2026.905.73500, and qits-ci resolves these two dot-paths since
# 2026.905.83431. Before that the event named no commit at all: `branch` is the release request's
# BACKING BRANCH, which the tagging operation deletes, and `version` names a tag rather than a
# commit — so this file could declare no `checkout:`, the run was recorded at `main`, and every
# release displayed as `main@<head>`, a run recorded against a commit it did not build.
#
# `branch: version` IS NOT A MISNOMER. The key is named for the run row's ref column, and a tag is a
# ref: the daemon clones `--branch "$QITS_CI_BRANCH"`, which git resolves against tags exactly as
# against heads, and the sha is what `checkout --detach` then lands on. Nothing in qits-ci holds a
# concept of a tag.
#
# `optional: true` IS THE TRANSITION AND IT STAYS UNTIL NO OLD EVENT CAN ARRIVE. `commitSha` is
# additive, so an `SCMRelease` published before it existed — a replay out of the durable log, a
# hand-built event through qits-ci's manual trigger door — resolves nothing here. Without the flag
# that would cost this pipeline its run, which is a released version whose artifact is silently
# never published. With it, such a run is recorded at `main`'s head, byte-for-byte as before, and
# the `git fetch refs/tags/$version` in the step below is what supplies the released tree — which
# is why that fetch STAYS: a no-op on the anchored path, the whole mechanism on the fallback one.
checkout:
  branch: version       # the tag's name — a ref name, which `clone --branch` resolves
  sha: commitSha        # what it points at; absent on any release published before the field
  optional: true        # ...and then this run is main's head, exactly as it was before
artifacts:
  - { type: docker, name: qits/workspace }
  # THE BARE BINARY, BACK — and not as the second image the note above retired. It is a plain file
  # taken out of the same `build` stage the image's daemon comes from (`--target binary`), so the
  # two coordinates cannot name different bytes, and there is still one native compile and one
  # build. What asks for it is qits-workspaces' pin test: it starts THIS daemon, at exactly the
  # version its pom pins, against localhost and runs a round-trip over the real control socket
  # before any workspace does. A container would need docker, and a CI step container has none.
  - { type: daemon, name: qits-workspace-daemon }
  # THE PIN AND THE PROTOCOL, IN ONE JAR. qits-workspaces used to read the workspace image version
  # out of `env.QITS_WORKSPACE_IMAGE_VERSION`, a configuration entry qits-configuration rewrote on
  # every release of this repository — so a new daemon reached a real workspace without the pair
  # ever having been built together. Now the version travels as the version of the artifact that
  # also carries the wire contract: the consumer depends on it, the maintenance train bumps it like
  # any internal library, and the consumer's own gate is where a daemon that broke the protocol
  # fails. WorkspaceImage's javadoc has the whole reasoning.
  - { type: maven, name: "eu.wohlben.qits:qits-workspace-daemon-protocol" }
steps:
    # ci-base: buildctl for the build, git for the tag checkout, jq for the event payload. Nothing
    # needs maven on ANY side of the builder — the reactor is built inside the image's own builder
    # stage.
    #
    # `build: true` IS THE BUILD DECLARATION — the socketless generation of `docker: true`: the
    # same per-step, diff-visible opt-in, keying the commissioned credential and the build
    # environment ($QITS_BUILD_REGISTRY here, $BUILDKIT_HOST from qits-containers), and no docker
    # socket anywhere in this step. The end state qits-buildkit-plan.md promised, arrived.
    #
    # TWO HOURS, NOT ONE. The build pulls the ~3.4 GB toolchain base and pushes a layer on top of
    # it, on top of the daemon's native compile. images/qits-oci-workspace found an hour short of
    # headroom for the same bytes on a cold cache.
  - image: qits/build-images/ci-base:latest
    build: true
    timeout-seconds: 7200
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed buildctl call is
      # swallowed and the run reports SUCCESS — and a green release run is what makes qits-ci
      # announce the artifact. -u makes an unset injected variable stop the step too.
      set -eu

      # The builder, demanded loudly before anything is built. Unset means a qits-ci/qits-containers
      # pair too old to inject it; EMPTY means the kill switch (qits.ci.buildkit.enabled=false
      # spells off as empty-never-absent). Either way this recipe must fail here, naming the cause,
      # rather than fall back to the socket it still holds — a silent fallback is exactly what the
      # migration exists to remove.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      : "${QITS_BUILD_REGISTRY:?}"

      # THE EVENT, READ AS DATA. The payload reaches the container verbatim as one string in
      # $QITS_EVENT_PAYLOAD; there is no per-field projection. `jq -er` fails the step on an absent
      # field rather than composing a reference out of the word "null".
      version=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -er .version)
      # THE TAG NAME IS THE VERSION, and release versions are CalVer — digits and dots. Checked
      # before anything is built, because the version becomes a registry TAG: a malformed one would
      # publish under a coordinate nobody can guess, and a value carrying `:` or `/` would land it
      # under a different name entirely. qits-ci-daemon and qits-oci refuse the same way for the
      # same reason.
      case "$version" in
        ''|*[!0-9.]*) echo "not a CalVer tag: $version" >&2; exit 1 ;;
      esac
      echo "releasing qits/workspace:$version"

      # THE TAG IS THE CHECKOUT TARGET. An event-triggered run is cloned at the head of main, which
      # is where the release commit is *now* — a later push moves that and the tag does not, so a
      # busy main cannot make this pipeline ship a different tree than the one that was released.
      # The clone is shallow and carries no tags, hence the explicit refspec; the URL rather than
      # `origin` because every address a step needs arrives as environment.
      #
      # It is also what makes the base pin reproducible. docker/Dockerfile's `ARG WORKSPACE_BASE`
      # travels with the tree, so rebuilding a released tag rebuilds it on the toolchain that tag
      # was released with — which is the whole reason the pin is a committed line rather than a
      # floating tag.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # The two secrets in FILE form on both sides of the wire: written here under umask 077 and
      # handed to buildctl as `src=`, mounted by the Dockerfile as bare files under /run/secrets —
      # never a --build-arg, which is recorded in a pullable image's history, and never the env=
      # mount form, which couples the recipe to the builder's dockerfile-frontend version. /tmp is
      # outside the clone, so neither file can enter the build context.
      # `-` rather than bare expansion under set -u: a deployment that commissions nothing sends
      # no pair at all, and that has to stay a build that resolves anonymously — the property the
      # env-form secret mounts always had — rather than a step that dies on an unset variable.
      umask 077
      printf '%s' "${QITS_COMMISSIONED_CLIENT_ID-}" > /tmp/qits-client-id
      printf '%s' "${QITS_COMMISSIONED_CLIENT_SECRET-}" > /tmp/qits-client-secret

      # NO --network host, AND NOTHING REPLACES IT. Every `RUN` executes in the platform builder's
      # own network namespace on qits-net, so the Maven Central mirror is dialled by its in-network
      # route — $QITS_MAVEN_PROXY_URL, the step plane's address, not the edge vhost the host
      # namespace needed. Empty — mirror off, or an older qits-ci — deactivates the settings
      # profile and the resolve goes to Central directly, as it always did. The Dockerfile's FROM
      # lines keep their committed edge-vhost spellings: the builder's own registry config rewrites
      # them to the platform aliases (qits-containers' buildkitd.toml carries that mapping).
      #
      # `push=true` IS THE PUBLISH: the image goes from the builder to the registry and never
      # enters any local image store — which is also why there is no `docker rmi` question left;
      # the old note about a concurrent-build rmi race described a store this pipeline no longer
      # touches. $QITS_BUILD_REGISTRY is the registry as the BUILDER resolves it; $QITS_REGISTRY
      # stays the host daemon's view and is not dialled here.
      ref="$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/workspace:$version"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output "type=image,name=$ref,push=true"

      # --- the SBOM -----------------------------------------------------------------------------
      # THE DOCUMENT GOES UP AFTER THE PUSH AND BEFORE THIS STEP EXITS GREEN. qits-ci announces
      # `SoftwareRelease` only where a green run and an `SCMRelease` meet, so ordering is the whole
      # guarantee: no consumer is ever told about a version whose bill of materials is missing. A
      # failed PUT fails the release ON PURPOSE — the store being down is not a reason to announce a
      # version nobody can audit. Only THIS pipeline uploads one: the QA pipeline's sha push
      # announces no release, so it owes no document. A bootstrap replay re-PUTs the same bytes
      # under the same coordinate, which is exactly what a restore should do.
      #
      # The second `buildctl build` reaches the Dockerfile's `sbom` stage — a `FROM scratch`
      # holding only the daemon module's CycloneDX document, exported with `type=local` instead of
      # pushed. Build-arg and secrets are BYTE-IDENTICAL to the image build above, which is what
      # makes every layer a cache hit in the same builder and this export seconds rather than a
      # second native compile. `target=sbom` also stops short of `${WORKSPACE_BASE}`, so the
      # ~3.4 GB toolchain is not pulled a second time for a document that does not describe it.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=sbom \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output type=local,dest=.sbom
      # The SBOM store is a sibling path of the npm registry inside the qits-artifacts deployment,
      # so its root is DERIVED from $QITS_NPM_REGISTRY_URL — the qits-net alias every step carries.
      # NOT from $QITS_REGISTRY, which is the host-published name: from in here it answers curl
      # with an instant connection refusal, and the edge in front of it 401s a sessionless write
      # besides (measured twice on 2026.902.53027). The path names the DECLARED artifact identity
      # verbatim: `artifacts:` above says `{type: docker, name: qits/workspace}`, and
      # (packageType, packageName, version) is how the SoftwareRelease consumer will ask for it.
      sbom_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @.sbom/sbom.json \
        "$sbom_base/docker/qits/workspace/-/$version"

      # --- the runnable daemon --------------------------------------------------------------------
      # A THIRD REACH INTO THE SAME BUILD. `target=binary` is a `FROM scratch` holding one file: the
      # daemon packaged as a runnable uber-jar, JVM-packaged on top of the `build` stage this run has
      # already produced, so with byte-identical build-args and secrets everything under it is a
      # cache hit and only the JVM package runs. It stops short of `${WORKSPACE_BASE}`, so the
      # ~3.4 GB toolchain is not pulled again for 13 MB.
      #
      # WHY IT EXISTS: qits-workspaces' pin test starts this daemon as a PROCESS, at exactly the
      # version its pom pins, and round-trips the real control-socket protocol before a workspace
      # uses the pair. A CI step container has no docker, so it cannot run the image — and what the
      # service talks to is the daemon inside the image, not the image.
      #
      # WHY A JAR AND NOT THE NATIVE BINARY: every step image on this platform is Alpine (musl) and
      # the native image is built on UBI9 (glibc), so the bare binary is an artifact the gate could
      # never execute. docker/Dockerfile's `runnable` stage carries the whole reasoning and what the
      # pin test does and does not therefore prove.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=binary \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output type=local,dest=.binary

      # The daemon store is a sibling path of the SBOM store, derived from the same origin and for
      # the same reason ($QITS_REGISTRY is the host daemon's view and answers curl from in here with
      # an instant refusal). The path names the DECLARED artifact identity verbatim: `artifacts:`
      # above says `{type: daemon, name: qits-workspace-daemon}`.
      artifacts_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts"

      # 409 IS A HARD FAILURE, NOT A SKIP — the one place this pipeline differs from a maven or npm
      # publish. Versions are immutable in the daemon store, so a 409 says the release train tried
      # to ship a coordinate that is already spoken for; letting it pass would announce a
      # SoftwareRelease for bytes nobody published. Re-running a maven deploy is a no-op; re-running
      # this one would be a lie. qits-ci-daemon's pipeline refuses the same way.
      status=$(curl -sS -o /tmp/daemon-publish.json -w '%{http_code}' -X PUT \
        -H 'Content-Type: application/octet-stream' \
        --data-binary @.binary/qits-workspace-daemon.jar \
        "$artifacts_base/daemons/qits-workspace-daemon/$version")
      case "$status" in
        201) ;;
        409)
          echo "qits-workspace-daemon $version is already published — a version is never republished" >&2
          cat /tmp/daemon-publish.json >&2
          exit 1 ;;
        *)
          echo "publish answered $status: $(cat /tmp/daemon-publish.json)" >&2
          exit 1 ;;
      esac

      # The binary's bill of materials is the daemon module's, which is the document already
      # exported above — the same reactor closure, published a second time under the coordinate the
      # `daemon` declaration names. Same bytes, two artifacts, two coordinates: a consumer asking
      # about either is answered, and neither is told about a version whose document is missing.
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @.sbom/sbom.json \
        "$sbom_base/daemon/qits-workspace-daemon/-/$version"

    # --- the pin-and-protocol jar -----------------------------------------------------------------
    # A SECOND STEP, AND A DIFFERENT IMAGE, because this one needs maven and the one above needs
    # buildctl. It is deliberately AFTER the image push: the jar is what tells qits-workspaces which
    # image to start, so a jar resolvable before its image is pushed would be a pin pointing at
    # nothing — briefly, but a release is exactly the moment somebody is watching.
    #
    # It compiles the protocol module alone (`-pl`), which is dependency-free apart from junit, so
    # this step is seconds and shares nothing with the native compile above.
  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      set -eu
      version=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -er .version)
      case "$version" in
        ''|*[!0-9.]*) echo "not a CalVer tag: $version" >&2; exit 1 ;;
      esac
      # The tag, for the same reason the step above takes it: main has moved on, the tag has not,
      # and `${project.version}` of the released tree is what gets filtered into the jar as the
      # image tag it names.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # A published version is never republished, and re-running a deploy of the same bytes is a
      # no-op rather than a lie — so this one SKIPS where the daemon PUT above fails. That is the
      # maven and npm release steps' rule, not a weakening of the one above.
      #
      # BOTH POMS, and the `&&` is the javalib's "skip only when EVERY module is published" rule
      # arriving here the way it always should have. The jar alone is not a published artifact: a
      # consumer cannot read its descriptor without the parent, which is exactly how 2026.916.172630
      # shipped a coordinate that resolved for nobody. Checking one of the two would let a half
      # publish look complete on a re-run.
      if curl -fsS -o /dev/null \
        "$QITS_MAVEN_REGISTRY_URL/eu/wohlben/qits/qits-workspace-daemon-protocol/$version/qits-workspace-daemon-protocol-$version.pom" \
        && curl -fsS -o /dev/null \
          "$QITS_MAVEN_REGISTRY_URL/eu/wohlben/qits/$version/qits-$version.pom"; then
        echo "qits-workspace-daemon-protocol $version and its parent are already published — skipping"
        exit 0
      fi

      # -s and the two QITS_MAVEN_AUTH_* variables are the Dockerfile's arrangement, in a step
      # instead of a secret mount: the root pom declares `qits-maven` at an edge vhost that is dead
      # in here, and the settings file mirrors that id onto the in-network $QITS_MAVEN_REPOSITORY_URL
      # (and Central onto the platform's pull-through while $QITS_MAVEN_PROXY_URL is non-empty).
      # `-` under set -u: a deployment that commissions nothing sends no pair, and an anonymous
      # resolve is the state every hand build is in.
      QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
      QITS_MAVEN_AUTH_USR="${QITS_COMMISSIONED_CLIENT_ID-}" \
      QITS_MAVEN_AUTH_PSW="${QITS_COMMISSIONED_CLIENT_SECRET-}" \
      #
      # `-am` IS LOAD-BEARING AND IT IS THE PARENT POM. The protocol module declares
      # `<parent>eu.wohlben:qits:<version></parent>`, so a consumer resolving the jar must be able to
      # read that pom too — `-pl` alone deployed the jar and not its parent, and 2026.916.172630
      # therefore published an artifact nothing could resolve: "Failed to read artifact descriptor …
      # Could not find artifact eu.wohlben:qits:pom". The module depends on nothing in-reactor, so
      # `-am` adds exactly one thing, the aggregator, which is what a parent is for. It is also the
      # house pattern: qits-integrations-quarkus-javalib deploys from its ROOT for the same reason.
      ./mvnw -B -ntp -s .qits-maven-settings.xml -pl workspace-daemon-protocol -am deploy -DskipTests \
        -Dqits.maven.repository.url="$QITS_MAVEN_REGISTRY_URL" \
        -DaltDeploymentRepository="qits::default::$QITS_MAVEN_REGISTRY_URL"

      # Its own document, under its own coordinate — the closure of THIS jar, which is junit-free at
      # runtime and therefore nearly empty. That is the point: a consumer auditing what it pulled in
      # by pinning the workspace image should see that it pulled in nothing.
      QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
      ./mvnw -B -ntp -s .qits-maven-settings.xml -pl workspace-daemon-protocol -DskipTests \
        -Dqits.maven.repository.url="$QITS_MAVEN_REGISTRY_URL" \
        org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom \
        -DoutputFormat=json -DoutputName=sbom -DschemaVersion=1.6
      sbom_base="${QITS_MAVEN_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @workspace-daemon-protocol/target/sbom.json \
        "$sbom_base/maven/eu.wohlben.qits:qits-workspace-daemon-protocol/-/$version"
