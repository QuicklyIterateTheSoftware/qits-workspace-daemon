# The release pipeline: this repository reacts to its OWN release TAG and pushes the workspace image
# under the released VERSION.
#
# THE SELECTION NAMES THIS REPOSITORY, WHICH READS LIKE A LOOP AND IS NOT — the same shape every
# sibling's release pipeline has. `SCMRelease` says only "this repository released this version",
# and qits-projects says it the instant the tag is written; nothing here releases anything. The
# event that could loop is `SoftwareRelease`, and this file neither listens for it nor emits it.
#
# THE VERSION TAG IS A COORDINATE BESIDE THE SHA, NOT A REPLACEMENT FOR IT. The QA pipeline
# (ci-event-release-request.yml) keeps pushing `:$QITS_CI_SHA` for every fold it builds green; what
# this adds is a name a human and a downstream consumer can say out loud, and it is the one a
# deployment asks for. The two coordinates have two owners — a build is named by
# its commit, a release by its version — and that split is also the only shape that pushes reliably:
# a sibling tried `docker build -t A -t B` and its first release failed on `docker push B` with "tag
# does not exist", because BuildKit's exporter does not reliably leave every alias of a multi-tag
# build in the local image store. One build, one tag, one push.
#
# ONE ARTIFACT, WHERE THERE USED TO BE TWO. Until 2026-08-10 this pipeline pushed a bare-binary
# `qits/workspace-daemon` and then layered it into `qits/workspace` — two builds, two declarations,
# and a partial release possible between them. docker/Dockerfile does both halves in one build now,
# so there is one image and one thing to declare.
#
# `artifacts:` IS A DECLARATION, NOT A REPORT. qits-ci never learns how to publish anything — the
# `docker push` below is this repository's own step — so it cannot see what landed. It announces one
# `SoftwareRelease` per entry on the strength of this line once the whole pipeline is green. Keep it
# true.
#
# THE NAME IS UNQUALIFIED ON PURPOSE. No registry-qualified reference is portable here — the registry
# is `qits-platform-artifacts:8080` inside a step container and `localhost:8081` to qits-ci and
# qits-deployments — and an OCI reference cannot carry a path prefix. So the declaration carries
# `qits/workspace` and the reader supplies its own host, exactly as the step below
# composes one from environment.
#
# THE BUILD BELOW IS ci-event-release-request.yml's, AND THE TWO MUST STAY MATCHED. That file explains why
# `docker: true` is what the Dockerfile's `localhost:8082` and `localhost:8081` bases need, why no
# hand-rolled builder container is involved, and why there is no `--network` flag; this one carries
# the short form and points there rather than keeping a second copy of the reasoning to drift.
#
# THE VERSION TAG IS STILL THE DURABLE STAMP, BUT IT NO LONGER TRIGGERS. Under the release-request
# flow the tag is written by qits-githost's tag primitive, which announces nothing — the trigger is
# qits-projects' `SCMRelease`. A bootstrap replay therefore re-establishes a release by pushing the
# tag quietly and re-presenting the `SCMRelease` through qits-ci's manual trigger door
# (`POST /ci/api/events/trigger`), which runs this same pipeline. qits-ci still announces
# `SoftwareRelease` only where a green run and an `SCMRelease` meet.
#
# THE FILE HAS TO BE IN PLACE BEFORE THE TAG IT SELECTS IS PUSHED. The bus is at-most-once with no
# catch-up and no replay, so a trigger file arriving after its event loses that release and looks
# like a train that quietly did not roll.
#
event: SCMRelease
when:
  # SCMRelease, not SCMPublishTag: under the release-request flow the version tag is written by
  # qits-githost's tag primitive, which fires no post-receive and so publishes no SCMPublishTag —
  # a recipe listening for the tag event never runs again. qits-projects' Auto Release publishes
  # SCMRelease carrying the repository's public name, and a bootstrap replay arrives as this same
  # event through qits-ci's manual trigger door. A rename updates this line in the same campaign.
  - repository: { exact: qits-workspace-daemon }
# THE RUN IS ANCHORED AT THE TAG IT BUILDS. `SCMRelease` carries `commitSha` — the commit the tag
# points at — since qits-projects 2026.905.73500, and qits-ci resolves these two dot-paths since
# 2026.905.83431. Before that the event named no commit at all: `branch` is the release request's
# BACKING BRANCH, which the tagging operation deletes, and `version` names a tag rather than a
# commit — so this file could declare no `checkout:`, the run was recorded at `main`, and every
# release displayed as `main@<head>`, a run recorded against a commit it did not build.
#
# `branch: version` IS NOT A MISNOMER. The key is named for the run row's ref column, and a tag is a
# ref: the daemon clones `--branch "$QITS_CI_BRANCH"`, which git resolves against tags exactly as
# against heads, and the sha is what `checkout --detach` then lands on. Nothing in qits-ci holds a
# concept of a tag.
#
# `optional: true` IS THE TRANSITION AND IT STAYS UNTIL NO OLD EVENT CAN ARRIVE. `commitSha` is
# additive, so an `SCMRelease` published before it existed — a replay out of the durable log, a
# hand-built event through qits-ci's manual trigger door — resolves nothing here. Without the flag
# that would cost this pipeline its run, which is a released version whose artifact is silently
# never published. With it, such a run is recorded at `main`'s head, byte-for-byte as before, and
# the `git fetch refs/tags/$version` in the step below is what supplies the released tree — which
# is why that fetch STAYS: a no-op on the anchored path, the whole mechanism on the fallback one.
checkout:
  branch: version       # the tag's name — a ref name, which `clone --branch` resolves
  sha: commitSha        # what it points at; absent on any release published before the field
  optional: true        # ...and then this run is main's head, exactly as it was before
artifacts:
  - { type: docker, name: qits/workspace }
steps:
    # ci-base: the docker CLI for the build, git for the tag checkout, jq for the event payload.
    # Nothing needs maven on THIS side of the socket — the reactor is built inside the image's own
    # builder stage.
    #
    # TWO HOURS, NOT ONE. The build pulls the ~3.4 GB toolchain base and pushes a layer on top of it,
    # on top of the daemon's native compile. images/qits-oci-workspace found an hour short of
    # headroom for the same bytes on a cold cache.
  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 7200
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed docker build is
      # swallowed: the push runs on a stale local image or fails, `docker rmi || true` answers 0,
      # and the run reports SUCCESS — and a green release run is what makes qits-ci announce the
      # artifact. -u makes an unset injected variable stop the step too.
      set -eu

      # THE EVENT, READ AS DATA. The payload reaches the container verbatim as one string in
      # $QITS_EVENT_PAYLOAD; there is no per-field projection. `jq -er` fails the step on an absent
      # field rather than composing a reference out of the word "null".
      version=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -er .version)
      # THE TAG NAME IS THE VERSION, and release versions are CalVer — digits and dots. Checked
      # before anything is built, because the version becomes a registry TAG: a malformed one would
      # publish under a coordinate nobody can guess, and a value carrying `:` or `/` would land it
      # under a different name entirely. qits-ci-daemon and qits-oci refuse the same way for the
      # same reason.
      case "$version" in
        ''|*[!0-9.]*) echo "not a CalVer tag: $version" >&2; exit 1 ;;
      esac
      echo "releasing qits/workspace:$version"

      # THE TAG IS THE CHECKOUT TARGET. An event-triggered run is cloned at the head of main, which
      # is where the release commit is *now* — a later push moves that and the tag does not, so a
      # busy main cannot make this pipeline ship a different tree than the one that was released.
      # The clone is shallow and carries no tags, hence the explicit refspec; the URL rather than
      # `origin` because every address a step needs arrives as environment.
      #
      # It is also what makes the base pin reproducible. docker/Dockerfile's `ARG WORKSPACE_BASE`
      # travels with the tree, so rebuilding a released tag rebuilds it on the toolchain that tag was
      # released with — which is the whole reason the pin is a committed line rather than a floating
      # tag.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # The two --secret flags are the fleet's shape for a credential inside a build; the launcher
      # injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET, and the Dockerfile's mvnw
      # RUN mounts them for `.qits-maven-settings.xml`'s `qits-central-proxy` server — never a
      # --build-arg, which is recorded in a pullable image's history.
      #
      # --network host and the QITS_MAVEN_CENTRAL_URL build-arg route the RUN's Maven Central
      # resolve through the mirror: the injected URL is an edge vhost on 127.0.0.1:8080, which only
      # the host namespace reaches. Empty — an older qits-ci, or the mirror plane turned off —
      # deactivates the settings profile and the resolve goes to Central directly, as it always did.
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/workspace:$version"
      docker build --network host \
        --build-arg QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_CENTRAL_MIRROR_URL:-}" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving, which is the
      # race that broke the release of 2026-08-11.

      # --- the SBOM -----------------------------------------------------------------------------
      # THE DOCUMENT GOES UP AFTER THE PUSH AND BEFORE THIS STEP EXITS GREEN. qits-ci announces
      # `SoftwareRelease` only where a green run and an `SCMRelease` meet, so ordering is the whole
      # guarantee: no consumer is ever told about a version whose bill of materials is missing. A
      # failed PUT fails the release ON PURPOSE — the store being down is not a reason to announce a
      # version nobody can audit. Only THIS pipeline uploads one: the QA pipeline's sha push
      # announces no release, so it owes no document. A bootstrap replay re-PUTs the same bytes
      # under the same coordinate, which is exactly what a restore should do.
      #
      # The second `docker build` reaches the Dockerfile's `sbom` stage — a `FROM scratch` holding
      # only the daemon module's CycloneDX document, exported with `--output` instead of pushed.
      # Network, build-arg and secrets are BYTE-IDENTICAL to the image build above, which is what
      # makes every layer a cache hit and this export seconds rather than a second native compile.
      # `--target sbom` also stops short of `${WORKSPACE_BASE}`, so the ~3.4 GB toolchain is not
      # pulled a second time for a document that does not describe it.
      docker build --network host --target sbom --output type=local,dest=.sbom \
        --build-arg QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_CENTRAL_MIRROR_URL:-}" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -f docker/Dockerfile .
      # The SBOM store is a sibling path of the npm registry inside the qits-artifacts deployment,
      # so its root is DERIVED from $QITS_NPM_REGISTRY_URL — the qits-net alias every step carries.
      # NOT from $QITS_REGISTRY, which is the host-published name the docker daemon pushes through:
      # from in here it answers curl with an instant connection refusal, and the edge in front of it
      # 401s a sessionless write besides (measured twice on 2026.902.53027). The path names the
      # DECLARED artifact identity verbatim: `artifacts:` above says
      # `{type: docker, name: qits/workspace}`, and (packageType, packageName, version) is how the
      # SoftwareRelease consumer will ask for it.
      sbom_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @.sbom/sbom.json \
        "$sbom_base/docker/qits/workspace/-/$version"
