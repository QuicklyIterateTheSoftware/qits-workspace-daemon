# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# Two steps, both on every branch, and their order is the point:
#
#   1. `./mvnw verify` — this repo's first rule (CLAUDE.md): a clone of this repo alone builds and
#      tests green, with no docker and no prior install anywhere. It runs FIRST because it is the
#      cheap gate. A broken test must not cost a GraalVM native build.
#   2. the shipping form — the workspace image, whose builder stage is the native compile.
#
# THIS REPO NEEDS NO HAND-ROLLED BUILDER CONTAINER. docker/Dockerfile native-compiles the binary in a
# Mandrel builder stage and layers it onto the released toolchain in the same build, so a plain
# `docker build` is the whole thing. qits-ci-daemon starts a builder container by hand and copies the
# binary out because it ships a bare binary and no image at all; that shape does not belong here.
#
# WHY THE IMAGE STEP DECLARES `docker: true`: it hands the step the HOST daemon's socket, which is
# the side the Dockerfile is written for. Its registry references — the quay and Red Hat
# pull-through mirrors on `localhost:8082`, and the pinned toolchain base on `localhost:8081` — are
# addresses the host daemon resolves and nothing inside this step's container can. The native
# build's memory is the host daemon's for the same reason.
#
# No `--network` flag: nothing in this build dials the platform. The reactor declares no
# `<repositories>`, so the builder stage resolves from Maven Central, and every base image is the
# host daemon's to pull.
#
# ONE IMAGE, UNDER THE NAME ITS CONSUMERS ALREADY WRITE. The published name stays `qits/workspace`
# — qits-workspaces' pin and its follow-bump trigger both spell it — while the repository keeps its
# own name, the same split `qits-oci-workspace` publishing `qits/workspace-base` records. It used to
# be two images (a bare-binary `qits/workspace-daemon`, a layered `qits/workspace` built only on
# release), and the split meant the image a workspace actually runs had no sha coordinate at all.
# This pipeline is what keeps a sha coordinate under the one name.
#
# THE COST OF THAT IS PAID HERE AND IT IS REAL. This image carries the ~3.4 GB toolchain, so every
# push pulls and pushes it — where the retired bare-binary build was a few tens of megabytes. It buys
# the thing the split could not: what CI proves green on a commit is the image that runs, rather than
# one of its two halves. The timeout matches images/qits-oci-workspace's for the same bytes.
#
# ci-event-release.yml BESIDE THIS FILE IS THE OTHER HALF. This one names a build by its commit;
# that one names a release by its version. Neither pushes the other's coordinate.
#
# THE BUMP TRAIN'S LOOP IS CLOSED SOMEWHERE ELSE NOW. ci-event-upstream-oci-workspace.yml still
# follows a toolchain release by rewriting the base pin in docker/Dockerfile and pushing
# `maintenance/qits-workspace-oci`, and that push still lands here for its build. The release that
# used to follow it was a third step here asking the qits-workspaces door; qits-maintenance makes
# that ask itself now, with its own credential, on the same push. This pipeline builds; it no
# longer releases.
steps:
  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed build is swallowed
      # and the run reports SUCCESS.
      set -eu
      ./mvnw -B -ntp verify

  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 7200
    script: |
      # Same reason as above, and one more: without -e a failed `docker build` lets the push run on
      # a stale local image, `docker rmi || true` answers 0, and the run reports SUCCESS for an
      # image that was never built. -u stops the step on an unset registry variable rather than
      # composing a ref out of empty strings.
      set -eu
      # The two --secret flags are the fleet's shape for a credential inside a build: the launcher
      # injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET, and a Dockerfile that needs it
      # mounts it on one RUN — never a --build-arg, which is recorded in a pullable image's history.
      # This build needs none: its Maven resolve is reactor-only over public repositories, so there
      # is no `.qits-maven-settings.xml` here and no mount to feed. Both halves are free — buildx
      # ignores a secret no RUN mounts, and a missing env source is NOT an error (measured on buildx
      # v0.36.1, the build runs green with the variable unset).
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/workspace:$QITS_CI_SHA"
      docker build \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving. Two builds of
      # this one Dockerfile do run concurrently, main's and environment/dev's, which is the race
      # that broke the release of 2026-08-11.
