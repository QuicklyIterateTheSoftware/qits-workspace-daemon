# THE ONE QA PIPELINE THIS REPOSITORY HAS, and it runs for a release request and nothing else.
#
# There is no push pipeline any more, and `ci-post-receive.yml` is what this file replaces.
# qits-projects keeps a backing branch `release/<id>` per open release request — an octopus merge of
# that request's sources, refolded whenever the set changes — and publishes `ReleaseRequestChanged`
# on every successful re-fold. The merge primitive that writes that branch fires no `post-receive`
# and so publishes no `SCMPublishCommit`: without this file the fold exists and NOTHING BUILDS IT.
# A fold the git host answered `unchanged`, and one that conflicted, publish nothing — so every
# arrival here is a new sha worth a build.
#
# DECIDED AT MAIN, BUILT AT THE FOLD. This file is discovered, parsed and selected at `main`'s head,
# always; only the run's branch and sha come from the payload, which is why `checkout:` names them
# as a pair — a sha with no branch whose history holds it is not something a step container can
# fetch. A release request therefore cannot alter the CI that gates it by folding in a commit that
# edits this file. Inside a step, $QITS_CI_BRANCH is `release/<id>` and $QITS_CI_SHA is the merged
# sha; the fold is already checked out, so nothing below fetches or switches refs.
#
# EVERY STEP HERE IS GATING, INCLUDING THE ONE THAT PUSHES AN IMAGE. It stays in the gating half on
# purpose: whatever a run publishes is published before anything later can fail. The coordinate it
# pushes is the MERGED SHA, which no `ReleaseRequestChanged` is ever derived from, so this pipeline
# cannot re-trigger itself; and a redelivered event re-pushes identical content under the same tag,
# which is why nothing here treats an existing tag as an error. The verdict returns on the ordinary
# `BuildSuccessful`/`BuildFailed` with `commitSha` = the merged sha, which is what qits-projects'
# `BuildStatusListener` matches on together with `repoId`.
#
# ci-event-release.yml BESIDE THIS FILE IS UNTOUCHED and is still the other half: it reacts to this
# repository's release TAG and publishes the released coordinate. This file names a build by the
# merged sha; that one names a release by its version. Neither pushes the other's coordinate.
#
# Two steps, and their order is the point:
#
#   1. `./mvnw verify` — this repo's first rule (CLAUDE.md): a clone of this repo alone builds and
#      tests green, with no docker and no prior install anywhere. It runs FIRST because it is the
#      cheap gate. A broken test must not cost a GraalVM native build.
#   2. the shipping form — the workspace image, whose builder stage is the native compile.
#
# THIS REPO NEEDS NO HAND-ROLLED BUILDER CONTAINER. docker/Dockerfile native-compiles the binary in
# a Mandrel builder stage and layers it onto the released toolchain in the same build, so one
# `buildctl build` is the whole thing. qits-ci-daemon starts a builder container by hand and copies
# the binary out because it ships a bare binary and no image at all; that shape does not belong
# here.
#
# THE BUILD RUNS ON THE PLATFORM'S OWN BUILDKITD, NOT THE HOST DAEMON — qits-buildkit-plan.md in
# the wrapper is the whole migration; this file is its first converted recipe. `docker: true` stays
# as the build DECLARATION: it is the per-step, diff-visible opt-in the platform keys everything on
# (the commissioned credential, the auth document, and the $BUILDKIT_HOST qits-containers injects
# into exactly these steps). The script never touches the socket the flag still mounts; taking the
# mount away once no recipe uses it is the fleet-wide end state, not this file's move.
#
# THE DOCKERFILE'S REGISTRY REFERENCES STAY COMMITTED AS THEY ARE — the mirror and registry edge
# vhosts — and the builder's own registry config rewrites them to the platform aliases
# (qits-containers' buildkitd.toml carries the mapping). No `--network host` and nothing replaces
# it: a `RUN` executes in the builder's namespace on qits-net, so what a build dials, it dials by
# in-network address ($QITS_MAVEN_PROXY_URL below). The reactor declares no `<repositories>`, so
# the builder stage resolves from Maven Central — through that mirror when the platform offers one.
#
# ONE IMAGE, UNDER THE NAME ITS CONSUMERS ALREADY WRITE. The published name stays `qits/workspace`
# — qits-workspaces' pin and its follow-bump trigger both spell it — while the repository keeps its
# own name, the same split `qits-oci-workspace` publishing `qits/workspace-base` records. It used to
# be two images (a bare-binary `qits/workspace-daemon`, a layered `qits/workspace` built only on
# release), and the split meant the image a workspace actually runs had no sha coordinate at all.
# This pipeline is what keeps a sha coordinate under the one name.
#
# THE COST OF THAT IS PAID HERE AND IT IS REAL. This image carries the ~3.4 GB toolchain, so every
# fold pulls and pushes it — where the retired bare-binary build was a few tens of megabytes. It buys
# the thing the split could not: what CI proves green on a fold is the image that runs, rather than
# one of its two halves. The timeout matches images/qits-oci-workspace's for the same bytes.
#
# THE BUMP TRAIN REACHES THIS FILE THROUGH A RELEASE REQUEST NOW, NOT THROUGH A PUSH.
# ci-event-upstream-oci-workspace.yml still follows a toolchain release by rewriting the base pin in
# docker/Dockerfile and pushing `maintenance/qits-workspace-oci`. That push no longer builds anything
# on its own — there is no push pipeline left to catch it — so the branch is a SOURCE, and it is
# built here when qits-maintenance folds it into a release request. The release that used to follow
# the build was a third step here asking the qits-workspaces door; qits-maintenance makes that ask
# itself, with its own credential. This pipeline builds; it no longer releases.

event: ReleaseRequestChanged

when:
  # repoName, not repoId: the git host's storage coordinate is an opaque UUID since
  # the identity cutover, so a name match on repoId is not dependable. The event
  # echoes the public name; a rename updates this line in the same campaign.
  - repoName: { exact: qits-workspace-daemon }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed build is swallowed
      # and the run reports SUCCESS.
      set -eu
      # Maven Central through the platform mirror's in-network alias — empty (an older qits-ci that
      # injects nothing, or a deployment that turned the mirror plane off) deactivates the settings
      # profile and Central is resolved directly.
      export QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify

  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 7200
    script: |
      # Same reason as above, and one more: without -e a failed buildctl call would let a later
      # line run as if the image existed, and the run would report SUCCESS for an image that was
      # never built. -u stops the step on an unset injected variable rather than composing a ref
      # out of empty strings.
      set -eu
      # The builder, demanded loudly before anything is built. Unset means a qits-ci/qits-containers
      # pair too old to inject it; EMPTY means the kill switch. Either way this recipe fails here,
      # naming the cause, rather than falling back to the socket it still holds — the silent
      # fallback is exactly what the migration exists to remove.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      : "${QITS_BUILD_REGISTRY:?}"
      # The two secrets in FILE form on both sides: written under umask 077 outside the clone (so
      # they can never enter the build context), handed to buildctl as `src=`, mounted by the
      # Dockerfile as bare files under /run/secrets — never a --build-arg, which is recorded in a
      # pullable image's history. The launcher injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET; the Dockerfile's mvnw RUN
      # reads the files for `.qits-maven-settings.xml`'s `qits-central-proxy` server.
      umask 077
      printf '%s' "$QITS_COMMISSIONED_CLIENT_ID" > /tmp/qits-client-id
      printf '%s' "$QITS_COMMISSIONED_CLIENT_SECRET" > /tmp/qits-client-secret
      # The build-arg carries the mirror's IN-NETWORK route ($QITS_MAVEN_PROXY_URL): a RUN executes
      # in the builder's namespace on qits-net now, where the edge vhost the old --network host
      # reached does not resolve. Empty — an older qits-ci, or the mirror plane turned off —
      # deactivates the settings profile and the resolve goes to Central directly, as it always
      # did. `push=true` sends the image straight from the builder to the registry: no local image
      # store is in the path any more, which also retires the old rmi-race note — the concurrent
      # builds this file still has (a re-fold overlapping the previous one, or this file and
      # ci-event-release.yml) share the builder's cache, which is content-addressed and refcounted.
      ref="$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/workspace:$QITS_CI_SHA"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output "type=image,name=$ref,push=true"
