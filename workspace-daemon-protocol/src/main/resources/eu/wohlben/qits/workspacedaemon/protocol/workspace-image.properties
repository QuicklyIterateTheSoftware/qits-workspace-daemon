# Filtered at build time — see workspace-daemon-protocol/pom.xml's <resources> block and
# WorkspaceImage's javadoc. The value is this reactor's ${project.version}, which the release flow
# stamps with the version it is about to tag and push the image under, so the jar's version, the
# image tag and the daemon binary's version are one string by construction.
#
# Do NOT write a literal here. WorkspaceImage refuses a value that still starts with `$`, which is
# what an unfiltered copy of this file looks like.
version=${project.version}
